name: semantic-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-gate:
    name: blocking semantic gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install semantic gate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jsonschema rdflib pyshacl

      - name: Run blocking semantic gate
        run: python scripts/semantic_gate.py