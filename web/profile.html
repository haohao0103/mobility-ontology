<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>画像 AI 语义层 · 可视化</title>
<style>
  :root{
    --bg:#f3f5f9; --panel:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e7eb;
    --accent:#2563eb; --ok:#16a34a; --bad:#dc2626; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       font-size:13px;line-height:1.55}
  header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
         padding:11px 20px;background:#0f172a;color:#e2e8f0;flex-wrap:wrap}
  header .brand{font-size:16px;font-weight:700;letter-spacing:.3px}
  header .brand small{font-weight:400;color:#94a3b8;margin-left:8px;font-size:12px}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);
        border-radius:8px;padding:3px 10px;font-size:12px;color:#cbd5e1}
  .stat b{color:#fff;font-size:14px;margin-left:4px}
  header .spacer{flex:1}
  header .asof{display:flex;align-items:center;gap:5px;font-size:12px;color:#cbd5e1}
  header .asof input{background:#1e293b;border:1px solid #334155;color:#e2e8f0;
        border-radius:6px;padding:3px 6px;font-size:11px}
  header .asof button{background:#334155;border:1px solid #475569;color:#e2e8f0;
        border-radius:6px;padding:3px 8px;font-size:11px}
  header .asof button:hover{background:#475569}
  a.navlink{color:#93c5fd;text-decoration:none;font-size:12px}
  a.navlink:hover{text-decoration:underline}
  button,select,input,textarea{font:inherit}
  button{cursor:pointer}
  main{display:grid;grid-template-columns:296px minmax(0,1fr);gap:14px;
       padding:14px 18px 30px;max-width:1680px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;
         box-shadow:0 1px 2px rgba(15,23,42,.04);min-width:0}
  .panel h2{font-size:13px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);
            color:#111827;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .panel h2 .tag{font-size:11px;font-weight:400;color:var(--muted)}
  .sidebar{display:flex;flex-direction:column;overflow:hidden;align-self:start;
           position:sticky;top:64px;max-height:calc(100vh - 80px)}
  .filters{padding:10px 12px;border-bottom:1px solid var(--line);display:grid;gap:7px}
  .filters input,.filters select{width:100%;border:1px solid #d5dbe4;border-radius:8px;
        padding:6px 9px;background:#fff;color:#111827}
  .filters .row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .asset-list{list-style:none;margin:0;padding:6px;overflow:auto;flex:1}
  .asset-list li{padding:7px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .asset-list li:hover{background:#f8fafc;border-color:#eef2f7}
  .asset-list li.active{background:#eff6ff;border-color:#bfdbfe}
  .asset-list .aid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
        color:#334155;word-break:break-all}
  .asset-list .ameta{display:flex;gap:6px;align-items:center;margin-top:2px;color:var(--muted);font-size:11px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .content{display:flex;flex-direction:column;gap:12px;min-width:0}
  .asset-head{padding:13px 16px}
  .asset-head .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .asset-head .id{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
        color:#475569;word-break:break-all}
  .asset-head .name{font-size:17px;font-weight:700;color:#0f172a}
  .asset-head .desc{color:#475569;margin-top:6px;font-size:12px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .chip{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:999px;padding:2px 9px;
        font-size:11px;color:#334155;display:inline-flex;align-items:center;gap:4px}
  .chip b{color:#0f172a}
  .badge{font-size:10px;padding:1px 7px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
  .badge.kind{color:#fff}
  .badge.status{background:#eef2f7;color:#475569;border-color:#dbe3ec}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);
        border-radius:12px;padding:5px 6px}
  .tabs button{border:1px solid transparent;background:transparent;color:#475569;
        border-radius:8px;padding:6px 11px;font-size:12px}
  .tabs button:hover{background:#f8fafc}
  .tabs button.active{background:var(--accent);color:#fff;font-weight:600}
  .pane{padding:14px 16px;min-height:420px}
  .graph-wrap{position:relative;height:610px;border:1px solid #eef2f7;border-radius:10px;
      overflow:hidden;background:radial-gradient(circle at 1px 1px,#e2e8f0 1px,transparent 0) 0 0/22px 22px}
  svg.graph{width:100%;height:100%;display:block}
  .legend{position:absolute;right:10px;top:10px;background:rgba(255,255,255,.95);
      border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:11px;
      display:flex;gap:10px;flex-wrap:wrap;max-width:320px}
  .legend span{display:inline-flex;align-items:center;gap:4px;color:#374151}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .graph-hint{position:absolute;left:12px;bottom:10px;color:var(--muted);font-size:11px;
      background:rgba(255,255,255,.92);padding:2px 8px;border-radius:6px;border:1px solid var(--line)}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-bottom:12px}
  .check{border:1px solid #e5e7eb;border-radius:9px;padding:8px 10px;font-size:12px;
      display:flex;gap:7px;align-items:center}
  .check.ok{background:#f0fdf4;border-color:#bbf7d0;color:#166534}
  .check.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
  .check .mark{font-weight:700}
  .clist{list-style:none;margin:0;padding:0}
  .clist li{display:flex;gap:8px;padding:6px 2px;border-bottom:1px dashed #eef1f5;font-size:12px}
  .clist .cid{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
      color:#475569;min-width:26px}
  .risk{font-size:22px;font-weight:800;letter-spacing:.5px}
  .risk.HIGH{color:var(--bad)} .risk.MEDIUM{color:var(--warn)} .risk.LOW{color:var(--ok)}
  .impact-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:12px}
  .impact-head .chips{margin-top:0}
  .bar-row{display:grid;grid-template-columns:110px 1fr 24px;align-items:center;gap:8px;
      font-size:12px;margin:7px 0;color:#334155}
  .bar-track{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
  .bar-track i{display:block;height:100%;border-radius:99px;
      background:linear-gradient(90deg,#3b82f6,#60a5fa)}
  .legend-inline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;
      color:#475569;margin:0 0 8px 4px}
  .legend-inline span{display:inline-flex;align-items:center;gap:5px}
  .legend-inline i{width:9px;height:9px;border-radius:50%;display:inline-block}
  .split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:14px}
  .table{width:100%;border-collapse:collapse;font-size:12px}
  .table th{text-align:left;color:#64748b;font-weight:600;padding:6px 8px;
      border-bottom:1px solid var(--line);white-space:nowrap}
  .table td{padding:6px 8px;border-bottom:1px dashed #eef1f5;vertical-align:top}
  .table tr:hover td{background:#fafcff}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;word-break:break-all}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:5px 10px;margin-bottom:10px}
  .kv .k{color:var(--muted)}
  .kv .v{word-break:break-all}
  .timeline{list-style:none;margin:0;padding:0}
  .timeline li{display:grid;grid-template-columns:130px 66px 1fr;gap:9px;align-items:start;
      padding:7px 4px;border-bottom:1px dashed #eef1f5}
  .timeline .time{color:#64748b;font-variant-numeric:tabular-nums;font-size:11px}
  .badge.event{background:#e0f2fe;color:#0369a1}
  .badge.version{background:#dcfce7;color:#15803d}
  .evidence-grid,.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
  .card{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff}
  .card .ct{font-weight:600;color:#0f172a;margin-bottom:3px}
  .card .cm{color:#64748b;font-size:11px;word-break:break-all}
  .card .cv{font-size:21px;font-weight:800;color:#0f172a;margin:6px 0 2px}
  .gate{display:grid;grid-template-columns:minmax(320px,420px) minmax(0,1fr);gap:14px}
  .form{border:1px solid #e5e7eb;border-radius:10px;padding:12px;display:grid;gap:8px;background:#fcfdff}
  .form label{font-size:11px;color:#64748b;font-weight:600}
  .form input,.form select,.form textarea{width:100%;border:1px solid #d5dbe4;border-radius:8px;
      padding:6px 9px;background:#fff;color:#111827}
  .form textarea{min-height:86px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
  .form button{border:0;border-radius:8px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600}
  .form button:hover{filter:brightness(1.05)}
  .btn-sm{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 8px;
      font-size:11px;color:#334155;margin-right:4px}
  .btn-sm.ok{border-color:#86efac;color:#15803d}
  .btn-sm.bad{border-color:#fecaca;color:#b91c1c}
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:9px;margin-bottom:12px}
  .kpi{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff}
  .kpi span{display:block;color:#64748b;font-size:11px;font-weight:600}
  .kpi b{display:block;font-size:22px;line-height:1.25;color:#0f172a}
  .kpi.hot{border-color:#fecaca;background:#fff7f7}
  .kpi.hot b{color:#b91c1c}
  .risk{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:700;
      border:1px solid transparent}
  .risk.HIGH{background:#fee2e2;color:#b91c1c;border-color:#fecaca}
  .risk.MEDIUM{background:#fef3c7;color:#b45309;border-color:#fde68a}
  .risk.LOW{background:#dcfce7;color:#15803d;border-color:#bbf7d0}
  .corr-row{cursor:pointer}
  .corr-row.active td{background:#eff6ff}
  .issue{border:1px solid #e5e7eb;border-left-width:4px;border-radius:8px;padding:8px 10px;
      margin-bottom:7px;background:#fff;font-size:12px}
  .issue.HIGH{border-left-color:#dc2626;background:#fffafa}
  .issue.MEDIUM{border-left-color:#d97706;background:#fffdf5}
  .issue .it{display:flex;gap:7px;align-items:center;margin-bottom:3px}
  .issue .mono{font-size:10px;color:#64748b}
  .suggestion{border:1px solid #dbeafe;border-radius:8px;padding:9px 10px;background:#f8fbff;
      margin-bottom:7px;font-size:12px}
  .suggestion .st{font-weight:700;color:#1d4ed8;margin-bottom:4px}
  .suggestion code{background:#eef2ff;color:#3730a3;border-radius:4px;padding:0 4px;
      font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;word-break:break-all}
  .rulebox{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;
      background:#0f172a;color:#cbd5e1;border-radius:8px;padding:10px;line-height:1.55;
      word-break:break-all;max-height:150px;overflow:auto}
  .empty{padding:34px;text-align:center;color:var(--muted)}
  .trace{display:grid;gap:7px}
  .trace-step{display:grid;grid-template-columns:26px minmax(0,1fr);gap:9px;
      border-left:3px solid #bfdbfe;background:#f8fbff;border-radius:0 9px 9px 0;
      padding:8px 10px}
  .trace-step.bad{border-left-color:#fca5a5;background:#fffafa}
  .trace-step.ok{border-left-color:#86efac;background:#f7fef9}
  .trace-step .num{width:24px;height:24px;border-radius:50%;background:#dbeafe;color:#1d4ed8;
      display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
  .trace-step.bad .num{background:#fee2e2;color:#b91c1c}
  .trace-step.ok .num{background:#dcfce7;color:#15803d}
  .trace-step .tt{font-weight:700;color:#0f172a;font-size:12px;display:flex;gap:7px;
      align-items:center;flex-wrap:wrap}
  .trace-step .tsrc{font-size:10px;font-weight:500;color:#64748b;background:#eef2f7;
      border-radius:999px;padding:1px 7px}
  .trace-step .tq{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
      color:#475569;margin-top:3px;word-break:break-all}
  .trace-step .td{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
  .trace-step .td span{background:#fff;border:1px solid #e2e8f0;border-radius:6px;
      padding:1px 7px;font-size:11px;color:#334155}
  .trace-step.bad .td span{border-color:#fecaca;background:#fff}
  .trace-step .tc{font-size:12px;color:#334155;margin-top:5px}
  .trace-step .tc b{color:#0f172a}
  .trace-step .to{font-size:10px;color:#64748b;margin-top:5px}
  .trace-step .to b{color:#475569;font-weight:600}
  .trace-step[hidden]{display:none}
  .trace-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;
      border:1px solid #dbeafe;border-radius:9px;background:#f8fbff}
  .trace-nav .tp{font-size:12px;font-weight:700;color:#1d4ed8;white-space:nowrap}
  .trace-nav .tbar{width:110px;height:5px;background:#dbeafe;border-radius:99px;overflow:hidden}
  .trace-nav .tbar i{display:block;height:100%;background:#2563eb;border-radius:99px;
      transition:width .18s ease}
  .trace-nav .tsp{font-size:11px;color:#64748b}
  .trace-nav button{border:1px solid #cbd5e1;background:#fff;border-radius:7px;padding:3px 10px;
      font-size:11px;color:#334155;cursor:pointer}
  .trace-nav button:disabled{opacity:.4;cursor:not-allowed}
  .trace-nav button.primary{background:#2563eb;border-color:#2563eb;color:#fff}
  .llm-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .llm-card{border:1px solid #e5e7eb;border-radius:9px;padding:9px 11px;background:#fff}
  .llm-card.bad{border-color:#fecaca;background:#fffafa}
  .llm-card.ok{border-color:#bbf7d0;background:#f7fef9}
  .llm-card .lt{font-weight:700;font-size:12px;margin-bottom:5px}
  .llm-card.bad .lt{color:#b91c1c}.llm-card.ok .lt{color:#15803d}
  .llm-card ul{margin:0;padding-left:16px;color:#475569;font-size:11px;line-height:1.65}
  .llm-card li{margin:2px 0}
  .llm-note{margin-top:7px;border:1px dashed #cbd5e1;border-radius:8px;padding:8px 10px;
      font-size:12px;color:#334155;background:#fcfdff}
  .llm-note b{color:#0f172a}
  .cmp-big{font-size:24px;font-weight:800;line-height:1.1;margin:1px 0 2px}
  .llm-card.bad .cmp-big{color:#b91c1c}.llm-card.ok .cmp-big{color:#15803d}
  .cmp-sub{font-size:10px;color:#64748b;margin-bottom:6px}
  .cmp-list{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:3px}
  .cmp-list li{font-size:11px;color:#334155;line-height:1.55;padding-left:13px;position:relative}
  .cmp-list li:before{content:"•";position:absolute;left:2px;color:#94a3b8}
  .cmp-list li.miss{color:#94a3b8}
  .cmp-foot{font-size:11px;color:#475569;line-height:1.6;margin-top:7px;
      border-top:1px dashed #e2e8f0;padding-top:6px}
  .sq-src{font-size:10px;color:#475569;margin-top:5px;background:#fff;
      border:1px solid #e2e8f0;border-radius:6px;padding:3px 7px}
  .sq-src b{color:#1d4ed8;margin-right:4px}
  .onto-hero{border:1px solid #dbeafe;background:linear-gradient(135deg,#f8fbff,#fff);
      border-radius:12px;padding:13px 15px;margin-bottom:12px}
  .onto-hero .ot{font-size:15px;font-weight:700;color:#0f172a}
  .onto-hero .od{font-size:12px;color:#475569;margin-top:4px;max-width:1000px}
  .onto-hero .okpis{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .onto-kpi{background:#fff;border:1px solid #dbeafe;border-radius:8px;padding:3px 9px;
      font-size:11px;color:#475569}
  .onto-kpi b{color:#1d4ed8;font-size:14px;margin-left:4px}
  .onto-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
  .onto-card{border:1px solid #e5e7eb;border-radius:10px;padding:10px 12px;background:#fff}
  .onto-card .oh{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .onto-card .oh b{font-size:13px;color:#0f172a}
  .onto-card .oh code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;
      background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:1px 5px;color:#475569}
  .onto-card .odesc{font-size:11px;color:#64748b;margin:5px 0 0;min-height:30px}
  .onto-sec{font-size:10px;font-weight:700;color:#64748b;margin:9px 0 4px;letter-spacing:.3px}
  .onto-props,.onto-rels{display:flex;gap:4px;flex-wrap:wrap}
  .prop{font-size:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:5px;
      padding:1px 5px;color:#334155;white-space:nowrap}
  .prop.req{background:#eff6ff;border-color:#bfdbfe;color:#1d4ed8}
  .prop i{font-style:normal;color:#94a3b8;margin-left:3px;font-size:9px}
  .relchip{font-size:10px;background:#f5f3ff;border:1px solid #ddd6fe;color:#6d28d9;
      border-radius:5px;padding:1px 5px;white-space:nowrap}
  .relchip.in{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
  .onto-note{font-size:11px;color:#64748b;margin-top:6px}
  .schema-box{margin-top:11px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;padding:10px 12px}
  .schema-box .st{font-size:12px;font-weight:700;color:#0f172a;margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .schema-box .st .tag{font-size:10px;font-weight:400;color:#64748b}
  .schema-sum{cursor:pointer;color:#2563eb;font-size:10px;margin-top:4px}
  .step-query{margin-top:9px;border:1px solid #e2e8f0;border-radius:9px;padding:8px 10px;background:#f8fafc}
  .step-query .sqh{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;font-weight:700;color:#334155}
  .step-query .sqh .tag{font-weight:400;color:#64748b;font-size:10px}
  .step-query .sqh .mode{font-size:9px;font-weight:600;border-radius:4px;padding:1px 5px;
      background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe}
  .step-query .sqh .mode.app{background:#f1f5f9;color:#475569;border-color:#e2e8f0}
  .mini-graph{display:block;width:100%;height:auto;max-height:430px;margin-top:6px;
      background:#fff;border:1px solid #eef2f7;border-radius:7px}
  .sq-note{font-size:10px;color:#64748b;margin-top:5px;line-height:1.5}
  .sq-empty{font-size:11px;color:#64748b;padding:8px 9px;margin-top:6px;
      background:#fff;border:1px dashed #cbd5e1;border-radius:6px}
  .sq-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-height:120px;overflow:auto}
  .sq-list .prop{font-size:9px}
  @media (max-width:720px){.llm-grid{grid-template-columns:1fr}.onto-grid{grid-template-columns:1fr}}
  .err{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;
      padding:9px 11px;font-size:12px;margin-bottom:10px;word-break:break-all}
  .subhead{font-size:11px;font-weight:600;color:#475569;margin:12px 0 6px;letter-spacing:.4px}
  #toast{position:fixed;right:18px;bottom:18px;z-index:50;display:grid;gap:8px;max-width:420px}
  #toast .t{background:#0f172a;color:#e2e8f0;border-radius:9px;padding:9px 12px;font-size:12px;
      box-shadow:0 6px 24px rgba(15,23,42,.28);animation:fade .2s}
  #toast .t.bad{background:#7f1d1d}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (max-width:1080px){
    main{grid-template-columns:1fr}
    .sidebar{position:static;max-height:none}
    .split,.gate{grid-template-columns:1fr}
    .graph-wrap{height:480px}
  }
</style>
</head>
<body>
<header>
  <div class="brand">画像 AI 语义层<small>HugeGraph PD · 本体校验 · Agent 工具 · 写操作门禁</small></div>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <div class="asof">
    <span>as-of</span>
    <input type="datetime-local" id="asOf" step="1">
    <button id="asOfClear" type="button">实时</button>
  </div>
  <a class="navlink" href="#ontology" style="font-weight:700;color:#fbbf24">本体说明</a>
  <a class="navlink" href="/profile/order-ontology" target="_blank" rel="noreferrer">订单本体 ↗</a>
  <a class="navlink" href="/" target="_blank" rel="noreferrer">出行本体 ↗</a>
  <a class="navlink" href="/docs" target="_blank" rel="noreferrer">REST /docs ↗</a>
  <a class="navlink" href="/profile/ui">刷新</a>
</header>

<main>
  <aside class="panel sidebar">
    <h2>资产检索 <span class="tag" id="assetTotal"></span></h2>
    <div class="filters">
      <input id="q" placeholder="搜索人群 / 标签 / 策略 / 指标…" autocomplete="off">
      <div class="row">
        <select id="kind">
          <option value="">全部类型</option>
          <option value="crowd">人群 Crowd</option>
          <option value="tag">标签 Tag</option>
          <option value="strategy">策略 Strategy</option>
          <option value="canvas">画布 CanvasTask</option>
          <option value="metric">指标 Metric</option>
          <option value="evidence">证据 Evidence</option>
          <option value="version">版本 Version</option>
          <option value="operator">操作人 Operator</option>
          <option value="driver">司机 Driver</option>
          <option value="vehicle">车辆 Vehicle</option>
          <option value="city">城市 City</option>
          <option value="order">订单 Order</option>
        </select>
        <select id="status">
          <option value="">全部状态</option>
          <option value="ACTIVE">ACTIVE</option>
          <option value="DRAFT">DRAFT</option>
          <option value="PAUSED">PAUSED</option>
          <option value="RUNNING">RUNNING</option>
        </select>
      </div>
    </div>
    <ul class="asset-list" id="assetList"></ul>
  </aside>

  <section class="content">
    <div class="panel asset-head" id="assetHead"><div class="empty">请选择一个资产</div></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="panel pane" id="pane"><div class="empty">正在加载画像资产…</div></div>
  </section>
</main>

<div id="toast"></div>

<script>
const API = '/profile';
const KIND_COLOR = {crowd:'#2563eb',tag:'#7c3aed',strategy:'#059669',canvas:'#ea580c',
  metric:'#0891b2',evidence:'#ca8a04',version:'#64748b',operator:'#db2777',
  driver:'#0d9488',vehicle:'#4f46e5',city:'#9333ea',order:'#c2410c'};
const KIND_LABEL = {crowd:'人群',tag:'标签',strategy:'策略',canvas:'画布',
  metric:'指标',evidence:'证据',version:'版本',operator:'操作人',
  driver:'司机',vehicle:'车辆',city:'城市',order:'订单'};
const REL_LABEL = {crowd_has_tag:'含标签',crowd_derived_from:'派生自',
  strategy_targets_crowd:'触达人群',strategy_uses_tag:'使用标签',
  canvas_references_crowd:'引用人群',canvas_references_strategy:'引用策略',
  canvas_generates_order:'画布生成订单',
  asset_has_metric:'关联指标',asset_has_evidence:'关联证据',
  asset_has_version:'关联版本',version_generated_by:'生成人',
  crowd_scope_city:'人群覆盖城市',driver_owns_vehicle:'司机绑定车辆',
  driver_in_city:'司机所属城市',order_served_by_driver:'订单由司机服务',
  order_in_city:'订单所属城市'};
const PROP_LABEL = {name:'名称',display_name:'展示名',description:'描述',status:'状态',
  status_reason:'状态原因',owner:'负责人',domain:'业务域',source_system:'源系统',
  source_id:'源 ID',source_url:'源链接',keywords:'关键词',estimated_size:'预估规模',
  target_size:'目标规模',priority:'优先级',permission_scope:'权限范围',
  rule_expression:'圈选规则',rule_language:'规则语言',referenced_tags:'引用标签',
  scope:'范围',crowd_type:'人群类型',expected_city_count:'声明城市数',
  created_at:'创建时间',updated_at:'更新时间',metadata:'元数据',definition:'标签定义',
  expression:'标签表达式',value_type:'值类型',managed:'是否托管',city_code:'城市编码',
  city_name:'城市名',region:'区域',action:'动作',channel:'渠道',effective_from:'生效起点',
  effective_to:'生效终点',metric_name:'指标名',value:'值',unit:'单位',period:'周期',
  confidence:'置信度',observed_at:'观测时间',valid_from:'生效起点',valid_to:'失效起点',
  weight:'权重',asset_type:'资产类型',approved_by:'审批人'};
const TABS = [['ontology','本体说明'],['graph','关系图'],['overview','概览'],
  ['correction','人群纠错'],['forensic','图谱查询取证'],['validate','语义校验'],['impact','影响面'],
  ['lineage','派生血缘'],['evidence','证据链'],['metrics','指标'],['gate','写操作门禁']];

const state = {assets:[],asset:null,context:null,impact:null,validation:null,
  evidence:null,lineage:null,metrics:null,corrections:null,dictionary:null,selectedCrowd:null,
  caseContext:null,caseImpact:{},proposals:[],audit:[],activeTab:'correction',asOf:''};

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trunc = (s,n) => { s = String(s ?? ''); return s.length > n ? s.slice(0,n) + '…' : s; };

function toast(msg, bad) {
  const el = document.createElement('div');
  el.className = 't' + (bad ? ' bad' : '');
  el.textContent = msg;
  $('#toast').appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

async function api(path, opts = {}) {
  const res = await fetch(API + path, {headers:{'Content-Type':'application/json'}, ...opts});
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  if (!res.ok) {
    const d = data && data.detail;
    throw new Error(typeof d === 'string' ? d : (d ? JSON.stringify(d) : res.statusText));
  }
  return data;
}

// as-of 时态快照：非空时所有查询只返回该时间点有效的边。
const atQuery = () => state.asOf ? `&at=${encodeURIComponent(state.asOf)}` : '';
const atLabel = () => state.asOf
  ? `<span class="chip">as-of <b>${esc(state.asOf)}</b></span>`
  : '<span class="chip">实时快照</span>';

const kindColor = k => KIND_COLOR[k] || '#64748b';
const kindLabel = k => KIND_LABEL[k] || k || '未知';
const propName = p => PROP_LABEL[p] || p;
const propDef = p => ((state.dictionary && state.dictionary.property_defs) || {})[p] || {};
const schemaClass = n => {
  const classes = (state.dictionary && state.dictionary.classes) || [];
  return classes.find(c => n && c.id === n.label) ||
    classes.find(c => n && c.kind === n.kind) || null;
};
const schemaRelation = e => {
  const relations = (state.dictionary && state.dictionary.relations) || [];
  return relations.find(r => r.id === e.relation) || null;
};
function statusStyle(s) {
  if (['ACTIVE','RUNNING','COMPLETED'].includes(s)) return 'background:#dcfce7;color:#15803d;border-color:#bbf7d0';
  if (['PAUSED','REVIEW','SCHEDULED'].includes(s)) return 'background:#fef3c7;color:#b45309;border-color:#fde68a';
  if (['FAILED','CANCELLED','ARCHIVED'].includes(s)) return 'background:#fee2e2;color:#b91c1c;border-color:#fecaca';
  return '';
}
const kindBadge = k => `<span class="badge kind" style="background:${kindColor(k)}">${esc(kindLabel(k))}</span>`;
const statusBadge = s => s
  ? `<span class="badge status" style="${statusStyle(s)}">${esc(s)}</span>`
  : '<span class="badge status">-</span>';
const riskBadge = r => `<span class="risk ${esc(r || 'LOW')}">${esc(r || '-')}</span>`;
const money = v => '¥' + Number(v || 0).toLocaleString('zh-CN', {maximumFractionDigits: 0});

/* ------------------------------------------------------------- 初始化 */
async function loadHealth() {
  try {
    const h = await api('/health');
    const sc = h.schema || {}, sem = h.semantic || {};
    $('#stats').innerHTML = [
      `<div class="stat">状态<b style="color:${h.ok?'#4ade80':'#f87171'}">${h.ok?'OK':'DOWN'}</b></div>`,
      `<div class="stat">图谱<b>${esc(h.graphspace||'-')}/${esc(h.graph||'-')}</b></div>`,
      `<div class="stat">顶点类<b>${sc.vertexlabels ?? sem.classes ?? 0}</b></div>`,
      `<div class="stat">边类<b>${sc.edgelabels ?? sem.relations ?? 0}</b></div>`,
      `<div class="stat">属性键<b>${sc.propertykeys ?? 0}</b></div>`
    ].join('');
  } catch (e) {
    $('#stats').innerHTML = '<div class="stat">状态<b style="color:#f87171">DOWN</b></div>';
    toast('健康检查失败：' + e.message, true);
  }
}

async function searchAssets() {
  const q = $('#q').value.trim(), kind = $('#kind').value, status = $('#status').value;
  try {
    const data = await api(`/assets?query=${encodeURIComponent(q)}&kind=${encodeURIComponent(kind)}`
      + `&status=${encodeURIComponent(status)}&limit=100`);
    state.assets = data.items || [];
    $('#assetTotal').textContent = `共 ${data.total} 个`;
    renderAssetList();
    if (state.assets.length && (!state.asset || !state.assets.some(a => a.id === state.asset))) {
      selectAsset(state.assets[0].id);
    }
  } catch (e) {
    $('#assetList').innerHTML = `<li class="err">${esc(e.message)}</li>`;
  }
}

function renderAssetList() {
  const list = $('#assetList');
  if (!state.assets.length) { list.innerHTML = '<li class="empty">没有匹配资产</li>'; return; }
  list.innerHTML = state.assets.map(a => `
    <li data-id="${esc(a.id)}" class="${a.id === state.asset ? 'active' : ''}">
      <div class="aid">${esc(a.id)}</div>
      <div class="ameta">
        <span class="dot" style="background:${kindColor(a.kind)}"></span>${esc(kindLabel(a.kind))}
        ${a.status ? statusBadge(a.status) : ''}${a.owner ? `<span>· ${esc(a.owner)}</span>` : ''}
      </div>
    </li>`).join('');
  list.querySelectorAll('li[data-id]').forEach(li =>
    li.addEventListener('click', () => selectAsset(li.dataset.id)));
}

/* ------------------------------------------------------------- 资产详情 */
async function selectAsset(id) {
  state.asset = id;
  state.context = state.impact = state.validation = state.evidence = null;
  state.lineage = null;
  state.metrics = null;
  renderAssetList();
  renderHead();
  renderTabs();
  $('#pane').innerHTML = `<div class="empty">正在加载 ${esc(id)} …</div>`;
  try {
    state.context = await api(`/assets/${encodeURIComponent(id)}/context?level=NETWORK${atQuery()}`);
  } catch (e) {
    $('#pane').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  renderHead();
  await loadTab(state.activeTab);
}

function renderHead() {
  const c = state.context;
  if (!c) { $('#assetHead').innerHTML = '<div class="empty">请选择一个资产</div>'; return; }
  const s = c.summary || {};
  $('#assetHead').innerHTML = `
    <div class="top">
      ${kindBadge(c.kind)}
      <span class="name">${esc(c.display_name || c.name || c.asset_id)}</span>
      ${statusBadge(c.status)}
      ${c.owner ? `<span class="chip">Owner <b>${esc(c.owner)}</b></span>` : ''}
    </div>
    <div class="id">${esc(c.asset_id)}</div>
    ${c.description ? `<div class="desc">${esc(c.description)}</div>` : ''}
    <div class="chips">
      <span class="chip">关系 <b>${s.neighbors ?? 0}</b></span>
      <span class="chip">标签 <b>${s.tags ?? 0}</b></span>
      <span class="chip">证据 <b>${s.evidence ?? 0}</b></span>
      <span class="chip">版本 <b>${s.versions ?? 0}</b></span>
      <span class="chip">指标 <b>${s.metrics ?? 0}</b></span>
      <span class="chip">策略 <b>${s.strategies ?? 0}</b></span>
      <span class="chip">画布 <b>${s.canvases ?? 0}</b></span>
      <span class="chip">更新 <b>${esc(c.updated_at || '-')}</b></span>
    </div>`;
}

/* ------------------------------------------------------------------ tabs */
function renderTabs() {
  $('#tabs').innerHTML = TABS.map(([k, label]) =>
    `<button data-tab="${k}" class="${k === state.activeTab ? 'active' : ''}">${label}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    state.activeTab = b.dataset.tab;
    if (location.hash.slice(1) !== state.activeTab) {
      history.replaceState(null, '', '#' + state.activeTab);
    }
    renderTabs();
    loadTab(state.activeTab);
  }));
}

let tabSeq = 0;
async function loadTab(tab) {
  const seq = ++tabSeq;
  const pane = $('#pane');
  if (tab === 'ontology') { await loadOntology(); return; }
  if (!state.context) return;
  if (tab === 'graph') {
    pane.innerHTML = graphShell();
    try { await ensureDictionary(); } catch (e) { state.dictionary = null; }
    if (seq !== tabSeq) return;
    drawContextGraph();
    return;
  }
  if (tab === 'overview') { pane.innerHTML = overviewShell(); return; }
  pane.innerHTML = '<div class="empty">加载中…</div>';
  try {
    if (tab === 'correction') {
      state.corrections = await api('/corrections?limit=200');
      if (seq !== tabSeq) return;
      state.caseContext = null;
      const items = state.corrections.items || [];
      if (!state.selectedCrowd || !items.some(i => i.crowd_id === state.selectedCrowd)) {
        state.selectedCrowd = defaultCrowdId(items);
      }
      renderCorrection();
    } else if (tab === 'forensic') {
      await loadForensics(seq);
    } else if (tab === 'validate') {
      state.validation = await api(`/assets/${encodeURIComponent(state.asset)}/validate`);
      if (seq !== tabSeq) return;
      renderValidation();
    } else if (tab === 'impact') {
      state.impact = await api(`/assets/${encodeURIComponent(state.asset)}/impact?depth=3${atQuery()}`);
      if (seq !== tabSeq) return;
      renderImpact();
    } else if (tab === 'lineage') {
      state.lineage = await api(`/assets/${encodeURIComponent(state.asset)}/lineage?depth=3${atQuery()}`);
      if (seq !== tabSeq) return;
      renderLineage();
    } else if (tab === 'evidence') {
      state.evidence = await api(`/assets/${encodeURIComponent(state.asset)}/evidence?${atQuery().slice(1)}`);
      if (seq !== tabSeq) return;
      renderEvidence();
    } else if (tab === 'metrics') {
      state.metrics = await api(`/metrics?asset_id=${encodeURIComponent(state.asset)}&limit=50`);
      if (seq !== tabSeq) return;
      renderMetrics();
    } else if (tab === 'gate') {
      await loadGate();
    }
  } catch (e) {
    if (seq !== tabSeq) return;
    pane.innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

/* ----------------------------------------------------------- 本体说明 */
async function ensureDictionary() {
  if (!state.dictionary) state.dictionary = await api('/dictionary');
  return state.dictionary;
}

async function loadOntology() {
  const pane = $('#pane');
  if (!state.dictionary) pane.innerHTML = '<div class="empty">加载本体定义…</div>';
  try {
    await ensureDictionary();
  } catch (e) {
    pane.innerHTML = `<div class="err">${esc(e.message)}</div>`;
    return;
  }
  renderOntology();
}

function renderOntology() {
  const d = state.dictionary;
  const classes = d.classes || [], relations = d.relations || [];
  const constraints = d.constraints || [], machines = d.state_machines || {};
  const defs = d.property_defs || {};
  const propLabel = p => PROP_LABEL[p] || p;
  const propType = p => (defs[p] && defs[p].data_type) || '';
  const classLabel = id => {
    const c = classes.find(x => x.id === id);
    return c ? c.label : (id || '任意资产');
  };
  const outRels = c => relations.filter(r => (r.domains || []).includes(c.id));
  const inRels = c => relations.filter(r => r.range === c.id);
  const relsOf = c => outRels(c).map(r =>
      `<span class="relchip" title="${esc(r.id)}">${esc(r.label)} → ${esc(classLabel(r.range))}</span>`).join('')
    + inRels(c).map(r =>
      `<span class="relchip in" title="${esc(r.id)}">${esc((r.domains || []).map(classLabel).join(' / '))} → ${esc(r.label)}</span>`).join('');
  const crowd = classes.find(c => c.id === 'Crowd');
  const crowdText = crowd
    ? `以 Crowd 为例：它不是标签，也不是圈人策略，而是可计算的<b>人群资产</b>；共 ${crowd.properties.length} 个属性，其中 ${crowd.required.length} 个必填，并通过 crowd_has_tag、crowd_scope_city 等关系连接标签与城市。`
    : '';
  const clsCards = classes.map(c => {
    const req = new Set(c.required || []);
    const props = (c.properties || []).map(p =>
      `<span class="prop ${req.has(p) ? 'req' : ''}">${esc(propLabel(p))}<i>${esc(propType(p))}</i></span>`).join('');
    const rels = relsOf(c);
    return `<div class="onto-card">
      <div class="oh"><span class="dot" style="background:${kindColor(c.kind)}"></span>
        <b>${esc(c.label)}</b><code>${esc(c.id)}</code>
        <span class="chip">${esc(c.properties.length)} 属性</span></div>
      <div class="odesc">${esc(c.description)}</div>
      <div class="onto-sec">必填属性 · ${(c.required || []).length}</div>
      <div class="onto-props">${(c.required || []).map(p =>
        `<span class="prop req">${esc(propLabel(p))}</span>`).join('') || '<span class="onto-note">无</span>'}</div>
      <div class="onto-sec">全部属性 · ${c.properties.length}（蓝色为必填）</div>
      <div class="onto-props">${props || '<span class="onto-note">无</span>'}</div>
      <div class="onto-sec">关联关系 · ${outRels(c).length + inRels(c).length}</div>
      <div class="onto-rels">${rels || '<span class="onto-note">无</span>'}</div>
    </div>`;
  }).join('');
  const relRows = relations.map(r => `<tr>
    <td><b>${esc(r.label)}</b><div class="mono">${esc(r.id)}</div></td>
    <td>${esc((r.domains || []).map(classLabel).join(' / ') || '任意资产')}</td>
    <td>${esc(classLabel(r.range))}</td>
    <td>${r.temporal ? '<span class="badge status">时态边</span>' : '—'}</td>
    <td>${(r.properties || []).map(p => `<span class="prop">${esc(propLabel(p))}</span>`).join('') || '—'}</td>
    <td>${esc(r.description || '')}</td>
  </tr>`).join('');
  const correctionUsed = new Set(['C7', 'C12', 'C13', 'C14', 'C15']);
  const conRows = constraints.map(c => `<tr>
    <td><b>${esc(c.id)}</b><div class="mono">${esc(c.type || '')}</div></td>
    <td>${esc(c.label || '')}${correctionUsed.has(c.id) ? ' <span class="badge status">纠错直用</span>' : ''}
      <div class="mono" style="color:#64748b">${esc(c.message || '')}</div></td>
    <td><span class="badge status">${esc(c.severity || '')}</span></td>
    <td>${esc(c.target || '')}</td>
  </tr>`).join('');
  const smCards = Object.entries(machines).map(([cid, m]) => {
    const trans = Object.entries(m.transitions || {}).filter(([, to]) => (to || []).length)
      .map(([from, to]) => `<span class="relchip">${esc(from)} → ${esc(to.join(' / '))}</span>`).join('');
    return `<div class="onto-card">
      <div class="oh"><b>${esc(classLabel(cid))}</b><code>${esc(cid)}</code>
        <span class="chip">初始态 ${esc(m.initial)}</span></div>
      <div class="onto-sec">全部状态</div>
      <div class="onto-props">${(m.states || []).map(s =>
        `<span class="prop">${esc(s)}</span>`).join('')}</div>
      <div class="onto-sec">允许迁移</div>
      <div class="onto-rels">${trans || '<span class="onto-note">终态，无出边</span>'}</div>
    </div>`;
  }).join('');
  const gate = d.write_gate || {};
  const gateHtml = `<div class="onto-card" style="margin-top:10px">
    <div class="oh"><b>写操作门禁</b><code>write_gate</code></div>
    <div class="odesc">${esc(gate.policy || '')}</div>
    <div class="onto-sec">允许动作</div>
    <div class="onto-props">${(gate.allowed_actions || []).map(a =>
      `<span class="prop req">${esc(a)}</span>`).join('')}</div>
    <div class="onto-sec">禁止动作</div>
    <div class="onto-props">${(gate.forbidden || []).map(a =>
      `<span class="prop">${esc(a)}</span>`).join('')}</div>
  </div>`;
  $('#pane').innerHTML = `
    <div class="onto-hero">
      <div class="ot">本体说明 · ${d.class_count} 类顶点不是 ${d.class_count} 个圆圈，而是 ${d.class_count} 种带属性、带约束的业务对象</div>
      <div class="od">看关系图只能看到“谁连着谁”。这里把图背后的定义展开：
        顶点 = 名词 + 属性；边 = 动词 + 定义域/值域 + 时态；约束 = 什么时候判冲突。
        ${crowdText}</div>
      <div class="okpis">

/* ------------------------------------------------------- 图上的 Schema */
function renderGraphSchema(nodes, edges, sel, scope) {
  const el = $(sel);
  if (!el) return;
  const nameOf = id => {
    const n = nodes.find(x => x.id === id);
    return n ? (n.name || n.data && n.data.name || id) : id;
  };
  const reserved = new Set(['id', 'label', 'kind', 'name', 'display_name', 'properties',
    'neighbors', 'summary', 'trust', 'evidence', 'versions', 'metrics', 'lineage']);
  const nodeRows = nodes.map(n => {
    const cls = schemaClass(n);
    const data = n.data || {};
    const actual = ['status', 'owner', 'source_system', 'updated_at', 'description']
      .filter(k => data[k] !== undefined && data[k] !== null && data[k] !== '')
      .map(k => `<span class="prop">${esc(propName(k))}=${esc(trunc(String(data[k]), 90))}</span>`);
    const allActual = Object.keys(data).filter(k => !reserved.has(k) &&
        data[k] !== undefined && data[k] !== null && data[k] !== '' &&
        typeof data[k] !== 'object')
      .map(k => `<span class="prop">${esc(propName(k))}=${esc(trunc(String(data[k]), 120))}</span>`);
    const actualHtml = `${actual.join('') || '<span class="onto-note">-</span>'}
      ${allActual.length > actual.length ? `<details><summary class="schema-sum">
        全部 ${allActual.length} 项实例数据</summary>
        <div class="onto-props" style="margin-top:4px">${allActual.join('')}</div></details>` : ''}`;
    const schema = cls ? `<b>${esc(cls.label)}</b> <code>${esc(cls.id)}</code>
      <div class="onto-props" style="margin-top:4px">${(cls.required || []).map(p =>
        `<span class="prop req">${esc(propName(p))}</span>`).join('')}</div>
      <details><summary class="schema-sum">全部 ${(cls.properties || []).length} 个属性</summary>
        <div class="onto-props" style="margin-top:4px">${(cls.properties || []).map(p => {
          const t = (propDef(p) || {}).data_type || '';
          return `<span class="prop ${(cls.required || []).includes(p) ? 'req' : ''}">${esc(propName(p))}<i>${esc(t)}</i></span>`;
        }).join('')}</div>
      </details>` : '<span class="onto-note">本体中未找到该类</span>';
    return `<tr>
      <td><span class="dot" style="background:${kindColor(n.kind)}"></span>
        <b>${esc(nameOf(n.id))}</b><div class="mono">${esc(n.id)}</div></td>
      <td>${schema}</td>
      <td>${actualHtml}</td>
    </tr>`;
  }).join('');
  const edgeRows = edges.map(e => {
    const r = schemaRelation(e);
    const relation = r ? `<b>${esc(r.label)}</b> <code>${esc(r.id)}</code>
      <div class="mono">${esc((r.domains || []).map(d =>
        (schemaClass({ label: d }) || { label: d }).label).join(' / '))} → ${esc((schemaClass({ label: r.range }) || { label: r.range }).label)}</div>
      <div class="onto-note">${r.temporal ? '时态边 · valid_from/valid_to 可追溯' : '普通边'}</div>
      <div class="onto-props" style="margin-top:4px">${(r.properties || []).map(p =>
        `<span class="prop">${esc(propName(p))}</span>`).join('') || '无关系属性'}</div>`
      : `<b>${esc(e.relation)}</b><div class="onto-note">本体中未找到该关系</div>`;
    const actual = Object.entries(e.properties || {}).map(([k, v]) =>
      `<span class="prop">${esc(propName(k))}=${esc(trunc(String(v), 70))}</span>`).join('');
    return `<tr>
      <td><b>${esc(nameOf(e.source))}</b>
        <div style="color:#64748b;font-size:10px">${esc(REL_LABEL[e.relation] || e.relation)}
        ${e.active === false ? ' · 已失效' : ''}</div>
        <div class="mono">→ ${esc(nameOf(e.target))}</div></td>
      <td>${relation}</td>
      <td>${actual || '<span class="onto-note">-</span>'}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `<div class="schema-box">
    <div class="st">${esc(scope || '本次图')} · 顶点 Schema 与实例数据
      <span class="tag">${nodes.length} 个顶点 · 点击“全部属性”展开完整 Schema</span></div>
    <div style="overflow:auto"><table class="table">
      <thead><tr><th>顶点</th><th>类 Schema</th><th>实例数据</th></tr></thead>
      <tbody>${nodeRows}</tbody></table></div>
    <div class="st" style="margin-top:12px">${esc(scope || '本次图')} · 边 Schema 与实例数据
      <span class="tag">${edges.length} 条边 · 定义域 / 值域 / 时态 / 关系属性</span></div>
    <div style="overflow:auto"><table class="table">
      <thead><tr><th>边</th><th>关系 Schema</th><th>实例数据</th></tr></thead>
      <tbody>${edgeRows || '<tr><td colspan="3" class="empty">本次图没有边</td></tr>'}</tbody></table></div>
  </div>`;
}

const graphShell = () => `
  <div class="onto-note" style="margin:0 0 8px">
    图上的节点是本体顶点，边是语义关系；每类顶点都有属性，每条边都有定义域/值域。
    属性表、15 条约束和状态机见顶部「本体说明」。
  </div>
  <div class="graph-wrap">
    <svg class="graph" id="graph"></svg>
    <div class="legend" id="legend"></div>
    <div class="graph-hint">点击节点继续下钻 · 拖拽节点可调整布局 · 悬停顶点/边查看 Schema</div>

  <div id="graphSchema"></div>`;

function drawContextGraph() {
  const c = state.context;
  const root = {id:c.asset_id, kind:c.kind, label:c.label, name:c.display_name || c.name,
    status:c.status, data:c};
  const nodes = [root], seen = new Set([root.id]), edges = [];
  (c.neighbors || []).forEach(n => {
    const v = n.vertex;
    if (!v) return;
    if (!seen.has(v.id)) {
      seen.add(v.id);
      nodes.push({id:v.id, kind:v.kind, label:v.label,
        name:v.display_name || v.name, status:v.status, data:v});
    }
    const out = n.direction === 'OUT';
    edges.push({source: out ? root.id : v.id, target: out ? v.id : root.id,
      relation:n.relation, active:n.active, properties:n.properties || {}});
  });
  drawGraph($('#graph'), root, nodes, edges, null);
  renderLegend(nodes, '#legend');
  renderGraphSchema(nodes, edges, '#graphSchema', '当前关系图');
}

function renderLegend(nodes, sel) {
  const kinds = [...new Set(nodes.map(n => n.kind))].filter(Boolean);
  const el = $(sel);
  if (el) el.innerHTML = kinds.map(k =>
    `<span><i style="background:${kindColor(k)}"></i>${esc(kindLabel(k))}</span>`).join('');
}

function layoutForce(nodes, edges, W, H, rootId) {
  const cx = W / 2, cy = H / 2;
  const positions = {};
  const others = nodes.filter(n => n.id !== rootId);
  positions[rootId] = {x: cx, y: cy, r: 0};
  const baseR = Math.min(W, H) * 0.32;
  others.forEach((n, i) => {
    const a = (2 * Math.PI * i) / Math.max(others.length, 1) - Math.PI / 2;
    positions[n.id] = {x: cx + baseR * Math.cos(a), y: cy + baseR * Math.sin(a), r: 0};
  });
  const ids = nodes.map(n => n.id);
  for (let it = 0; it < 300; it++) {
    const cool = 1 - it / 300;
    const disp = {};
    ids.forEach(id => { disp[id] = {x: 0, y: 0}; });
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const a = positions[ids[i]], b = positions[ids[j]];
        const dx = a.x - b.x, dy = a.y - b.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = (ids[i] === rootId || ids[j] === rootId) ? 150 : 118;
        const rep = d < min ? (min - d) * 2.4 : 3600 / (d * d);
        const ux = dx / d, uy = dy / d;
        disp[ids[i]].x += ux * rep; disp[ids[i]].y += uy * rep;
        disp[ids[j]].x -= ux * rep; disp[ids[j]].y -= uy * rep;
      }
    }
    edges.forEach(e => {
      const a = positions[e.source], b = positions[e.target];
      if (!a || !b) return;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 0.01;
      const f = (d - 165) * 0.025;
      const ux = dx / d, uy = dy / d;
      disp[e.source].x += ux * f; disp[e.source].y += uy * f;
      disp[e.target].x -= ux * f; disp[e.target].y -= uy * f;
    });
    ids.forEach(id => {
      if (id === rootId) return;
      disp[id].x += (cx - positions[id].x) * 0.005;
      disp[id].y += (cy - positions[id].y) * 0.005;
      const p = positions[id], d = disp[id];
      const len = Math.hypot(d.x, d.y) || 1;
      const step = Math.min(len, 12) * (0.5 + 0.5 * cool);
      p.x = Math.max(78, Math.min(W - 78, p.x + d.x / len * step));
      p.y = Math.max(72, Math.min(H - 92, p.y + d.y / len * step));
    });
  }
  for (let k = 0; k < 300; k++) {
    const push = {};
    ids.forEach(id => { push[id] = {x: 0, y: 0}; });
    let overlap = false;
    for (let i = 0; i < ids.length; i++) {
      for (let j = i + 1; j < ids.length; j++) {
        const a = positions[ids[i]], b = positions[ids[j]];
        const dx = b.x - a.x, dy = b.y - a.y;
        const d = Math.hypot(dx, dy) || 0.01;
        const min = (ids[i] === rootId || ids[j] === rootId) ? 150 : 118;
        if (d >= min) continue;
        overlap = true;
        const half = (min - d) / 2;
        const ux = dx / d, uy = dy / d;
        if (ids[i] === rootId) {
          push[ids[j]].x += ux * half * 2; push[ids[j]].y += uy * half * 2;
        } else if (ids[j] === rootId) {
          push[ids[i]].x -= ux * half * 2; push[ids[i]].y -= uy * half * 2;
        } else {
          push[ids[i]].x -= ux * half; push[ids[i]].y -= uy * half;
          push[ids[j]].x += ux * half; push[ids[j]].y += uy * half;
        }
      }
    }
    if (!overlap) break;
    ids.forEach(id => {
      if (id === rootId) return;
      const p = positions[id];
      p.x = Math.max(78, Math.min(W - 78, p.x + push[id].x));
      p.y = Math.max(72, Math.min(H - 92, p.y + push[id].y));
    });
  }
  return positions;
}

function drawGraph(svg, root, nodes, edges, distanceMap, navigable = true) {
  if (!svg) return;
  const box = svg.parentElement.getBoundingClientRect();
  const W = Math.max(680, Math.round(box.width));
  const H = Math.max(440, Math.round(box.height));
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const cx = W / 2, cy = H / 2;
  const force = !!distanceMap;
  let positions;
  if (force) {
    positions = layoutForce(nodes, edges, W, H, root.id);
  } else {
    const dist = {[root.id]: 0};
    nodes.forEach(n => { if (dist[n.id] === undefined) dist[n.id] = 1; });
    const rings = {};
    nodes.forEach(n => {
      const d = dist[n.id] || 0;
      if (d > 0) (rings[d] = rings[d] || []).push(n);
    });
    const maxR = Math.min(W, H) / 2 - 74;
    positions = {[root.id]: {x: cx, y: cy, r: 0}};
    Object.keys(rings).map(Number).forEach(d => {
      const arr = rings[d];
      arr.forEach((n, i) => {
        const angle = -Math.PI / 2 + (2 * Math.PI * i) / arr.length;
        positions[n.id] = {
          x: cx + maxR * Math.cos(angle), y: cy + maxR * Math.sin(angle), r: maxR
        };
      });
    });
  }

  let html = `<defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>
    <marker id="arrowOff" viewBox="0 0 10 10" refX="24" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#cbd5e1"/></marker>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.18"/></filter>
  </defs>`;

  if (!force) {
    html += `<circle cx="${cx}" cy="${cy}" r="${Math.min(W, H) / 2 - 74}"
      fill="none" stroke="#e2e8f0" stroke-dasharray="4 6"/>`;
  }

  edges.forEach(e => {
    const a = positions[e.source], b = positions[e.target];
    if (!a || !b) return;
    const active = e.active !== false;
    const r = schemaRelation(e);
    const schemaLine = r
      ? `关系 ${r.label} (${r.id}) · ${(r.domains || []).join('/')} → ${r.range}${r.temporal ? ' · 时态边' : ''} · 关系属性 ${(r.properties || []).join(', ') || '无'}`
      : `关系 ${e.relation} · 本体中未找到定义`;
    const actualLine = Object.entries(e.properties || {}).map(([k, v]) => `${k}=${v}`).join(' · ') || '无实例属性';
    const edgeTitle = [REL_LABEL[e.relation] || e.relation, `${e.source} → ${e.target}`,
      schemaLine, `实例数据 ${actualLine}`].map(esc).join('&#10;');
    const line = `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
      stroke="${active ? '#b6c2d2' : '#e2e8f0'}" stroke-width="${active ? 1.4 : 1.1}"
      stroke-dasharray="${active ? '0' : '5 5'}"
      marker-end="url(#${active ? 'arrow' : 'arrowOff'})"/>`;
    html += `<g class="gedge" data-s="${esc(e.source)}" data-t="${esc(e.target)}">
      <title>${edgeTitle}</title>${line}`;
    if (!force) {
      html += `<text x="${(a.x + b.x) / 2}" y="${(a.y + b.y) / 2 - 4}" text-anchor="middle"
        font-size="10" fill="#64748b" style="paint-order:stroke;stroke:#fff;stroke-width:3px">
        ${esc(REL_LABEL[e.relation] || e.relation)}</text>`;
    }
    html += `</g>`;
  });

  nodes.forEach((n, idx) => {
    const p = positions[n.id];
    if (!p) return;
    const isRoot = n.id === root.id;
    const rad = isRoot ? 33 : 23;
    const name = trunc(n.name || n.id || '', isRoot ? 12 : 7);
    const above = force && !isRoot && idx % 2 === 1;
    const labelY = isRoot ? -rad - 14 : (above ? -rad - 12 : rad + 14);
    const cls = schemaClass(n);
    const data = n.data || {};
    const actual = ['status', 'owner', 'source_system', 'updated_at', 'description']
      .filter(k => data[k] !== undefined && data[k] !== null && data[k] !== '')
      .map(k => `${propName(k)}=${data[k]}`);
    const nodeTitle = [n.id, `${kindLabel(n.kind)} · ${n.status || '-'}`,
      cls ? `类 Schema ${cls.label} (${cls.id}) · ${(cls.properties || []).length} 个属性` : '本体中未找到该类',
      cls ? `必填 ${(cls.required || []).map(propName).join(', ') || '无'}` : '',
      cls ? `全部属性 ${(cls.properties || []).map(propName).join(', ')}` : '',
      `实例数据 ${actual.join(' · ') || '无'}`
    ].filter(Boolean).map(esc).join('&#10;');
    const caption = cls ? `${cls.id} · ${(cls.properties || []).length} 属性` : '';
    html += `<g class="gnode" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})"
      style="cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none">
      <title>${nodeTitle}</title>
      <circle cx="0" cy="0" r="${rad}" fill="${kindColor(n.kind)}" stroke="#fff"
        stroke-width="2.5" ${isRoot ? 'filter="url(#shadow)"' : ''}/>
      <text x="0" y="4" text-anchor="middle" font-size="${isRoot ? 13 : 10}"
        font-weight="700" fill="#fff">${esc(kindLabel(n.kind))}</text>
      ${isRoot ? '' : `<text x="0" y="${labelY}" text-anchor="middle" font-size="11" fill="#334155"
        style="paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(name)}</text>`}
      ${caption ? `<text x="0" y="${labelY + 12}" text-anchor="middle" font-size="9" fill="#94a3b8"
        style="paint-order:stroke;stroke:#fff;stroke-width:3px">${esc(caption)}</text>` : ''}
    </g>`;
  });
  html += `<text x="14" y="20" font-size="11" fill="#64748b">中心资产：${esc(trunc(root.name || root.id, 30))}</text>`;
  svg.innerHTML = html;

  const toSvg = ev => {
    const pt = svg.createSVGPoint();
    pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  };
  const moveEdges = id => {
    svg.querySelectorAll('.gedge').forEach(eg => {
      if (eg.dataset.s !== id && eg.dataset.t !== id) return;
      const a = positions[eg.dataset.s], b = positions[eg.dataset.t];
      const line = eg.querySelector('line');
      if (!a || !b || !line) return;
      line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
      line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
      const label = eg.querySelector('text');
      if (label) {
        label.setAttribute('x', (a.x + b.x) / 2);
        label.setAttribute('y', (a.y + b.y) / 2 - 4);
      }
    });
  };

  svg.querySelectorAll('.gnode').forEach(g => {
    let drag = null;
    g.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      const p = positions[g.dataset.id];
      if (!p) return;
      const pt = toSvg(ev);
      drag = {x:pt.x, y:pt.y, ox:p.x, oy:p.y, moved:false};
      g.style.cursor = 'grabbing';
      try { g.setPointerCapture(ev.pointerId); } catch (e) { /* synthetic event */ }
    });
    g.addEventListener('pointermove', ev => {
      if (!drag) return;
      const pt = toSvg(ev);
      const dx = pt.x - drag.x, dy = pt.y - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) drag.moved = true;
      if (!drag.moved) return;
      const p = positions[g.dataset.id];
      p.x = Math.max(40, Math.min(W - 40, drag.ox + dx));
      p.y = Math.max(40, Math.min(H - 40, drag.oy + dy));
      g.setAttribute('transform', `translate(${p.x},${p.y})`);
      moveEdges(g.dataset.id);
    });
    const endDrag = ev => {
      if (!drag) return;
      const moved = drag.moved;
      drag = null;
      g.style.cursor = 'grab';
      if (moved) {
        g.dataset.dragged = '1';
        setTimeout(() => { delete g.dataset.dragged; }, 250);
      }
      try {
        if (ev && ev.pointerId !== undefined && g.hasPointerCapture(ev.pointerId)) {
          g.releasePointerCapture(ev.pointerId);
        }
      } catch (e) { /* synthetic event */ }
    };
    g.addEventListener('pointerup', endDrag);
    g.addEventListener('pointercancel', endDrag);
    g.addEventListener('click', ev => {
      ev.stopPropagation();
      if (g.dataset.dragged === '1') { delete g.dataset.dragged; return; }
      if (navigable && g.dataset.id && g.dataset.id !== state.asset) selectAsset(g.dataset.id);
    });
  });
}

async function loadCaseGraph(crowdId) {
  const box = $('#caseGraph');

    renderCaseGraph(state.caseContext);

  box.innerHTML = '<div class="empty">加载该案例的图谱查询结果…</div>';

    await ensureDictionary();
