function renderCaseGraph(c) {
  const box = $('#caseGraph');
  if (!box) return;
  const root = {id:c.id, kind:c.kind, label:c.label, name:c.display_name || c.name,
    status:c.status, data:c};
  const nodes = [root], seen = new Set([root.id]), edges = [];
  (c.neighbors || []).forEach(n => {
    const v = n.vertex;
    if (!v) return;
    if (!seen.has(v.id)) {
      seen.add(v.id);
      nodes.push({id:v.id, kind:v.kind, label:v.label,
        name:v.display_name || v.name, status:v.status, data:v});
    }
    const out = n.direction === 'OUT';
    edges.push({source: out ? root.id : v.id, target: out ? v.id : root.id,
      relation:n.relation, active:n.active, properties:n.properties || {}});
  });
  box.innerHTML = `<div class="onto-note" style="margin:0 0 6px">
      查询 <code>GET /profile/assets/${esc(c.id)}/context?level=NETWORK</code>
      · 返回 ${nodes.length} 个顶点 / ${edges.length} 条边 · 悬停顶点或边查看 Schema
    </div>
    <div class="graph-wrap" style="height:470px">
      <svg class="graph" id="caseGraphSvg"></svg>
      <div class="legend" id="caseLegend"></div>
      <div class="graph-hint">HugeGraph 实际查询结果 · 1 跳子图 · 悬停顶点/边查看 Schema</div>
    </div>
    <div id="caseSchema"></div>`;
  const dist = {[root.id]: 0};
  nodes.forEach(n => { if (dist[n.id] === undefined) dist[n.id] = 1; });
  drawGraph($('#caseGraphSvg'), root, nodes, edges, dist, false);
  renderLegend(nodes, '#caseLegend');
  renderGraphSchema(nodes, edges, '#caseSchema', `案例图谱 · ${trunc(root.name || root.id, 20)}`);
  const item = (((state.corrections || {}).items) || []).find(i => i.crowd_id === c.id);
  renderStepQueries(c, item);
}

function correctionTrace(it) {
  const k = it.kpi || {}, intent = it.intent || {}, rule = it.rule || {}, issues = it.issues || [];
  const cityIssue = issues.find(x => x.code === 'CITY_COVERAGE_MISMATCH');
  const tagIssue = issues.find(x => x.code === 'TAG_INTENT_CONFLICT' || x.code === 'TAG_RULE_CONFLICT');
  const vehicleIssue = issues.find(x => x.code === 'VEHICLE_CONFLICT');
  const stickerIssue = issues.find(x => x.code === 'STICKER_CONFLICT');
  const cond = field => (rule.conditions || []).find(c => c.field === field);
  const ruleVehicle = (cond('vehicle_type') || {}).value;
  const ruleSticker = (cond('sticker_status') || {}).value;
  const high = issues.filter(x => x.severity === 'HIGH').length;
  const missing = cityIssue ? (cityIssue.missing_cities || []) : [];
  const tags = (rule.tag_semantics || []).map(t =>
    `${t.name}${t.vehicle_type ? ' · 车型 ' + t.vehicle_type : ''}${t.sticker_status ? ' · 车贴 ' + t.sticker_status : ''}`);
  const steps = [];
  const push = (title, src, query, data, conclusion, tone = '') =>
    steps.push({n: steps.length + 1, title, src, query, data, conclusion, tone});
  const ONTO = {
    '取人群资产': '<b>Crowd 类</b> + C1 资产 ID 规范 + C2 必填属性（name/status/owner/estimated_size）',
    '抽业务意图': '应用层意图抽取，<b>不是本体</b>；它读取 Crowd 的 name/description 与 expected_city_count 做候选判断',
    '解析圈选规则': '<b>Crowd.rule_expression</b> + C13 规则必须可解析',
    '对齐引用标签': '<b>crowd_has_tag 关系</b> + C7 人群必须挂标签 + Tag.expression 标签表达式',
    '对齐托管城市': '<b>City 类</b> + managed 属性 + C15 托管城市覆盖完整性',
    '冲突判定': 'C13 规则可解析 + C14 名称/描述与规则一致 + C15 城市覆盖 + 冲突码定义',
    '风险与资损': '应用层风险规则，<b>不属于本体</b>；本体提供 estimated_size 与冲突字段作为输入',
    '生成修复建议': '<b>suggestions 契约</b> + write_gate.allowed_actions 动作白名单',
    '写操作门禁': '<b>write_gate 契约</b> + 状态机 + 审计留痕',
    '修复后复检': 'C13-C15 重新执行 + 时态边 + 版本可追溯'
  };

  push('取人群资产', '人群资产 · Crowd 节点', `get_vertex("${it.crowd_id}")`,
    [`status=${it.status || '-'}`, `owner=${it.owner || '-'}`, `规模=${k.estimated_size ?? '-'}`, `声明城市=${intent.expected_city_count ?? '-'}`],
    `拿到 <b>${esc(it.name || it.crowd_id)}</b>，当前 ${esc(it.status || '-')}，规模 ${Number(k.estimated_size || 0).toLocaleString('zh-CN')}。`);

  const intentBits = [
    intent.vehicle_type ? `车型=${intent.vehicle_type}` : '车型=未声明',
    intent.sticker_status ? `车贴=${intent.sticker_status}` : '车贴=未声明',
    intent.expected_city_count ? `城市=${intent.expected_city_count}` : '城市=未声明'
  ];
  push('抽业务意图', '名称 + 描述 + 属性兜底', 'extract_intent(name, description, props)',
    [...intentBits, ...(intent.concepts || []).map(c => `概念=${c}`)],
    `业务意图：<b>${esc(intent.vehicle_type || '未声明车型')} + ${esc(intent.sticker_status || '未声明车贴')} + ${intent.expected_city_count ? esc(intent.expected_city_count) + ' 城' : '未声明城市数'}</b>。`,
    (vehicleIssue || stickerIssue) ? 'bad' : '');

  const ruleBits = [
    `车型=${ruleVehicle || '未声明'}`,
    `车贴=${ruleSticker || '未声明'}`,
    `城市=${rule.city_count ?? 0}`,
    `来源=${rule.source || 'none'}`
  ];
  const ruleConflicts = [];
  if (vehicleIssue) ruleConflicts.push(vehicleIssue.message);
  if (stickerIssue) ruleConflicts.push(stickerIssue.message);
  push('解析圈选规则', 'rule_expression', 'parse_rule(rule_expression)',
    [...ruleBits, rule.parse_errors && rule.parse_errors.length ? `解析错误=${rule.parse_errors.length}` : '解析错误=0'],
    ruleConflicts.length ? ruleConflicts.map(esc).join('；') : '规则可解析，与业务意图字段未发现直接冲突。',
    ruleConflicts.length ? 'bad' : 'ok');

  push('对齐引用标签', 'crowd_has_tag → Tag', 'list_edges(crowd) → get_vertex(tag)',
    tags.length ? tags : ['未挂标签'],
    tagIssue ? esc(tagIssue.message) : (tags.length ? '标签表达式与业务意图一致，未发现标签冲突。' : '人群未挂标签，C7 要求补标签。'),
    tagIssue ? 'bad' : (tags.length ? 'ok' : ''));

  const expectedCity = intent.expected_city_count;
  push('对齐托管城市', 'City(managed=true)', 'list_vertices(label="City") → 集合差',
    [`规则城市=${rule.city_count ?? 0}`, `声明城市=${expectedCity ?? '未声明'}`, `漏配=${cityIssue ? cityIssue.missing_count : 0}`],
    cityIssue
      ? `${esc(cityIssue.message)}<br><b>漏配：${esc(missing.join('、') || '-')}</b>`
      : (expectedCity ? `声明 ${expectedCity} 城，规则覆盖 ${rule.city_count ?? 0} 城，差集为空。` : '未声明城市数，跳过城市覆盖校验。'),
    cityIssue ? 'bad' : (expectedCity ? 'ok' : ''));

  const issueChips = issues.map(x =>
    `<span>${esc(ISSUE_LABEL[x.code] || x.code)} · ${esc(x.severity)}</span>`).join('');
  push('冲突判定', 'C13-C15 · diagnose_payload', 'issues = detect(intent, rule, tags, cities)',
    issueChips ? [issueChips] : ['无冲突'],
    issues.length ? `共 <b>${issues.length}</b> 条冲突，其中 <b>${high}</b> 条 HIGH。` : '未发现冲突，进入正常校验。',
    high ? 'bad' : (issues.length ? '' : 'ok'));

  push('风险与资损', '确定性规则引擎', 'risk = HIGH if highs else MEDIUM if mediums else LOW',
    [`verdict=${it.verdict || '-'}`, `risk=${it.risk_level || '-'}`, `avoided_loss=${money(k.avoided_loss)}`],
    it.verdict === 'BLOCK'
      ? `命中 HIGH，结论 <b>BLOCK</b>，预计避免资损 <b>${money(k.avoided_loss)}</b>。`
      : `结论 <b>${esc(it.verdict || '-')}</b>，风险 ${esc(it.risk_level || '-')}。`,
    it.verdict === 'BLOCK' ? 'bad' : (it.verdict === 'REVIEW' ? '' : 'ok'));

  push('生成修复建议', 'suggestions → propose_change', 'generate_suggestions(issues, intent)',
    (it.suggestions || []).map((s, i) => `建议${i + 1}：${s.label}`),
    (it.suggestions || []).length
      ? `输出 <b>${it.suggestions.length}</b> 条建议，每条都带可提交门禁的 <b>propose_change</b>。`
      : '无需自动修复。',
    'ok');

  push('写操作门禁', 'propose_change → confirm_change', 'POST /proposals → POST /confirm',
    ['提议=PENDING', '确认后=EXECUTED', '驳回=REJECTED', '审计=全量留痕'],
    'Agent 只能提议，必须人工确认才落图；驳回同样留痕。');

  const closed = it.verdict === 'PASS' && issues.length === 0;
  push('修复后复检（示意）', 'diagnose(crowd_id)', 'GET /assets/{id}/diagnose',
    [`本次结论=${it.verdict || '—'}`, `本次冲突数=${issues.length}`, `复检=尚未执行`],
    closed
      ? '本次诊断结论为 PASS 且无冲突；修复动作仍需复检确认后才能闭环。'
      : `本次诊断结论为 ${esc(it.verdict || '—')}、冲突 ${issues.length} 条；尚未闭环，不能宣布「修复后=PASS」。`,
    closed ? 'ok' : '');

  return `<div class="trace" data-trace>
    <div style="font-size:12px;opacity:.75;padding:0 0 10px">
      以下为<b>讲解用示意轨迹</b>：步骤骨架与查询表达式是预置文案，数据取自本次诊断接口返回；不是逐步实时执行的推理链，也不代表修复动作已执行。
    </div>
    <div class="trace-nav">
      <span class="tp" data-trace-title>步骤 1 / ${steps.length}</span>
      <div class="tbar"><i data-trace-bar style="width:${100 / steps.length}%"></i></div>
      <span class="tsp" data-trace-sub>${esc(steps[0].title)}</span>
      <span style="flex:1"></span>
      <button data-trace-prev disabled>← 上一步</button>
      <button class="primary" data-trace-next>下一步 →</button>
      <button data-trace-all>展开全部</button>
    </div>
    ${steps.map(s => `
    <div class="trace-step ${s.tone}" data-trace-step="${s.n}" data-title="${esc(s.title)}"
        ${s.n === 1 ? '' : 'hidden'}>
      <div class="num">${s.n}</div>
      <div>
        <div class="tt">${esc(s.title)}<span class="tsrc">${esc(s.src)}</span></div>
        <div class="tq">${esc(s.query)}</div>
        <div class="td">${s.data.map(d => { const x = String(d); return x.startsWith('<') ? x : `<span>${esc(x)}</span>`; }).join('')}</div>
        <div class="tc">${s.conclusion}</div>
        <div class="step-query" data-step-query="${s.n}" id="stepQuery${s.n}">
          <div class="empty">加载该步图谱查询结果…</div>
        </div>
        ${ONTO[s.title] ? `<div class="to">依据（示意说明，非本体实时读取）：${ONTO[s.title]}</div>` : ''}
      </div>
    </div>`).join('')}</div>`;
}

/* 诊断推理链：默认只看第 1 步，按“下一步”逐条展开该步查询与判定。 */
function bindTraceSteps(pane) {
  const trace = pane.querySelector('[data-trace]');
  if (!trace) return;
  const steps = [...trace.querySelectorAll('[data-trace-step]')];
  const total = steps.length;
  if (!total) return;
  const prev = trace.querySelector('[data-trace-prev]');
  const next = trace.querySelector('[data-trace-next]');
  const all = trace.querySelector('[data-trace-all]');
  const title = trace.querySelector('[data-trace-title]');
  const sub = trace.querySelector('[data-trace-sub]');
  const bar = trace.querySelector('[data-trace-bar]');
  let cur = 1, expanded = false;
  const paint = () => {
    steps.forEach(el => {
      el.hidden = expanded ? false : Number(el.dataset.traceStep) !== cur;
    });
    title.textContent = expanded ? `全部 ${total} 步` : `步骤 ${cur} / ${total}`;
    sub.textContent = expanded ? '点击“逐步查看”回到单步模式' : (steps[cur - 1].dataset.title || '');
    bar.style.width = `${(expanded ? 1 : cur / total) * 100}%`;
    prev.disabled = expanded || cur <= 1;
    next.disabled = expanded || cur >= total;
    all.textContent = expanded ? '逐步查看' : '展开全部';
  };
  prev.addEventListener('click', () => { if (cur > 1) { cur -= 1; paint(); } });
  next.addEventListener('click', () => { if (cur < total) { cur += 1; paint(); } });
  all.addEventListener('click', () => { expanded = !expanded; paint(); });
  paint();
}

/* ------------------------------------------------ 每一步的图谱查询取证 */
function caseStepFacts(c, it) {
  const k = (it && it.kpi) || {}, intent = (it && it.intent) || {};
  const issues = (it && it.issues) || [];
  const cityIssue = issues.find(x => x.code === 'CITY_COVERAGE_MISMATCH');
  const root = {id:c.id, kind:c.kind, label:c.label, name:c.display_name || c.name,
    status:c.status, data:{...c, rule_expression:(it && it.rule && it.rule.raw) || c.rule_expression,
      estimated_size:k.estimated_size, expected_city_count:intent.expected_city_count}};
  const neighbors = c.neighbors || [];
  const tagRows = neighbors.filter(n => n.relation === 'crowd_has_tag' && n.vertex);
  const cityRows = neighbors.filter(n => n.relation === 'crowd_scope_city' && n.vertex);
  const toNode = n => ({id:n.vertex.id, kind:n.vertex.kind, label:n.vertex.label,
    name:n.vertex.display_name || n.vertex.name, status:n.vertex.status, data:n.vertex});
  const toEdge = n => ({source:n.source_id || (n.direction === 'OUT' ? c.id : n.vertex.id),
    target:n.target_id || (n.direction === 'OUT' ? n.vertex.id : c.id),
    relation:n.relation, active:n.active, properties:n.properties || {}});
  const tagNodes = tagRows.map(toNode), cityNodes = cityRows.map(toNode);
  const tagEdges = tagRows.map(toEdge), cityEdges = cityRows.map(toEdge);

  const linked = new Set(cityNodes.map(n => String(n.name || n.id)));
  const missing = (cityIssue ? (cityIssue.missing_cities || []) : [])
    .filter(name => !linked.has(String(name)));
  const missingNodes = missing.map((name, i) => ({
    id:`missing-city-${i}`, kind:'city', label:'City', name, status:'MISSING',
    __missing:true, data:{city_name:name, managed:true, status:'MISSING'}
  }));
  const missingEdges = missingNodes.map(n => ({
    source:c.id, target:n.id, relation:'crowd_scope_city', active:false,
    missing:true, properties:{'判定':'City 托管全集差集', '状态':'应连未连'}
  }));
  const issueText = issues.map(x => `${ISSUE_LABEL[x.code] || x.code}·${x.severity}`).join('；');

  return [
    {n:1, mode:'graph', nodes:[root], edges:[],
     source:'Crowd 顶点属性（name/status/owner/estimated_size）',
     note:'get_vertex 返回 1 个 Crowd 顶点；读取 name/status/owner/estimated_size/expected_city_count。'},
    {n:2, mode:'app', nodes:[root], edges:[],
     source:'应用层意图抽取（非本体）',
     note:'不新增图谱查询；输入是第 1 步返回的 Crowd 顶点字段，输出业务意图。'},
    {n:3, mode:'app', nodes:[root], edges:[],
     source:'Crowd.rule_expression',
     note:'不新增图谱查询；输入是 Crowd.rule_expression 原始值，输出可解析条件。'},
    {n:4, mode:'graph', nodes:[root, ...tagNodes], edges:tagEdges,
     source:'crowd_has_tag → Tag.expression',
     note:`实际查询 crowd_has_tag 出边并回查 Tag 顶点；返回 ${tagNodes.length} 个 Tag / ${tagEdges.length} 条时态边。`},
    {n:5, mode:'graph', nodes:[root, ...cityNodes, ...missingNodes],
     edges:[...cityEdges, ...missingEdges],
     source:'crowd_scope_city + City.managed 全集差集',
     note:`实际查询 crowd_scope_city 出边 + City 托管全集；已连 ${cityNodes.length} 城，差集漏配 ${missingNodes.length} 城（红色虚线为应连未连）。`},
    {n:6, mode:'app', nodes:[root, ...tagNodes, ...cityNodes, ...missingNodes],
     edges:[...tagEdges, ...cityEdges, ...missingEdges],
     source:'C1/C13/C14/C15 约束',
     note:`不新增图谱查询；汇总第 1/4/5 步返回的顶点、边、属性做确定性冲突判定。${issueText ? ' 输出：' + issueText : ''}`},
    {n:7, mode:'app', nodes:[root], edges:[],
     source:'Crowd.estimated_size + 冲突结果',
     note:'不新增图谱查询；风险规则读取 Crowd.estimated_size 与第 6 步冲突结果。'},
    {n:8, mode:'app', nodes:[], edges:[],
     source:'suggestions 契约 + write_gate 白名单',
     note:`不查询图谱；输入是第 6 步的 ${issues.length} 条冲突，输出 propose_change 修复契约。`},
    {n:9, mode:'app', nodes:[], edges:[],
     source:'write_gate + 状态机 + 审计',
     note:'不查询图谱；只处理 propose_change、状态机和审批审计。'},
    {n:10, mode:'graph', nodes:[root], edges:[],
     source:'GET /assets/{id}/diagnose 复检',
     note:'复检会重新执行第 1-7 步图谱查询；当前展示待复检的 Crowd 顶点。'}
  ];
}

function miniGraphNodeTitle(n) {
  const cls = schemaClass(n);
  const props = ((cls && cls.properties) || []).map(propName).join('、');
  return [kindLabel(n.kind), n.name || n.id, '类=' + (n.label || '-'),
    props ? 'Schema 属性=' + props : ''].filter(Boolean).join(' | ');
}

function miniGraphEdgeTitle(e) {
  const rel = schemaRelation(e);
  const props = ((rel && rel.properties) || []).map(propName).join('、');
  return [(REL_LABEL[e.relation] || e.relation), `${e.source} → ${e.target}`,
    e.missing ? '应连未连' : (e.active === false ? '已失效' : '有效'),
    props ? 'Schema 属性=' + props : ''].filter(Boolean).join(' | ');
}

function renderMiniGraph(nodes, edges, uid) {
  if (!nodes.length) return '';
  const root = nodes[0], others = nodes.slice(1);
  const n = others.length;
  const cols = Math.max(1, Math.ceil(Math.sqrt(Math.max(n, 1))));
  const rows = Math.max(1, Math.ceil(n / cols));
  const nodeW = 150, nodeH = 42, xGap = 24, yGap = 14;
  const startX = n ? 210 : 150, startY = 22;
  const W = n ? startX + cols * (nodeW + xGap) + 16 : 320;
  const H = n ? Math.max(130, startY + rows * (nodeH + yGap) + 18) : 150;
  const rootX = n ? 84 : W / 2, rootY = n ? H / 2 : 62;
  const pos = {};
  others.forEach((node, i) => {
    const col = Math.floor(i / rows), row = i % rows;
    pos[node.id] = {x:startX + col * (nodeW + xGap), y:startY + row * (nodeH + yGap)};
  });
  const visible = new Set(nodes.map(x => x.id));
  const edgeSvg = edges.filter(e => visible.has(e.source) && visible.has(e.target)).map(e => {
    const target = pos[e.target] || pos[e.source] || {x:rootX, y:rootY};
    const fromRoot = e.source === root.id;
    const sx = fromRoot ? rootX + 31 : target.x;
    const sy = fromRoot ? rootY : target.y + nodeH / 2;
    const tx = fromRoot ? target.x : target.x + nodeW;
    const ty = target.y + nodeH / 2;
    const mx = (sx + tx) / 2;
    const color = e.missing ? '#dc2626' : (e.active === false ? '#94a3b8' : '#94a3b8');
    const marker = e.missing ? `maMissing${uid}` : `ma${uid}`;
    const label = edges.length <= 8
      ? `<text x="${mx}" y="${(sy + ty) / 2 - 4}" text-anchor="middle" font-size="9"
           fill="${e.missing ? '#dc2626' : '#64748b'}">${esc(REL_LABEL[e.relation] || e.relation)}${e.missing ? ' · 漏配' : ''}</text>`
      : '';
    return `<g><title>${esc(miniGraphEdgeTitle(e))}</title>
      <path d="M ${sx} ${sy} C ${mx} ${sy}, ${mx} ${ty}, ${tx} ${ty}" fill="none"
        stroke="${color}" stroke-width="1.3" ${e.missing ? 'stroke-dasharray="5 4"' : ''}
        marker-end="url(#${marker})"/>${label}</g>`;
  }).join('');
  const nodeSvg = others.map(node => {
    const p = pos[node.id], color = node.__missing ? '#dc2626' : kindColor(node.kind);
    const name = trunc(node.name || node.id, 18);
    const sub = node.__missing ? 'City · 托管全集差集'
      : `${node.label || kindLabel(node.kind)}${node.status ? ' · ' + node.status : ''}`;
    return `<g><title>${esc(miniGraphNodeTitle(node))}</title>
      <rect x="${p.x}" y="${p.y}" width="${nodeW}" height="${nodeH}" rx="8"
        fill="${node.__missing ? '#fef2f2' : '#fff'}" stroke="${color}" stroke-width="1.4"
        ${node.__missing ? 'stroke-dasharray="5 3"' : ''}/>
      <text x="${p.x + 9}" y="${p.y + 17}" font-size="11" fill="#0f172a">${esc(name)}</text>
      <text x="${p.x + 9}" y="${p.y + 32}" font-size="9" fill="${node.__missing ? '#dc2626' : '#64748b'}">${esc(trunc(sub, 22))}</text>
    </g>`;
  }).join('');
  const rootName = n ? `<text x="${rootX}" y="${rootY + 51}" text-anchor="middle"
      font-size="11" fill="#0f172a">${esc(trunc(root.name || root.id, 22))}</text>` : '';
  return `<svg class="mini-graph" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="ma${uid}" markerWidth="8" markerHeight="8" refX="7" refY="3"
        orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#94a3b8"/></marker>
      <marker id="maMissing${uid}" markerWidth="8" markerHeight="8" refX="7" refY="3"
        orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#dc2626"/></marker>
    </defs>
    ${edgeSvg}
    <g><title>${esc(miniGraphNodeTitle(root))}</title>
      <circle cx="${rootX}" cy="${rootY}" r="30" fill="${kindColor(root.kind)}" stroke="#fff" stroke-width="2"/>
      <text x="${rootX}" y="${rootY + 4}" text-anchor="middle" font-size="10" fill="#fff">${esc(kindLabel(root.kind))}</text>
    </g>${rootName}
    ${nodeSvg}
  </svg>`;
}

function stepQueryHtml(spec) {
  const edgeCount = (spec.edges || []).length;
  const nodeCount = (spec.nodes || []).length;
  const mode = spec.mode === 'graph'
    ? '<span class="mode">图谱查询</span>'
    : '<span class="mode app">非图谱步骤</span>';
  const graph = nodeCount
    ? renderMiniGraph(spec.nodes, spec.edges || [], spec.n)
    : `<div class="sq-empty">该步不查询图谱，输入来自前序步骤的查询结果。</div>`;
  const nodeChips = (spec.nodes || []).map(n => {
    const bits = [];
    if (n.status) bits.push(n.status);
    if (n.__missing) bits.push('漏配');
    if (n.data && n.data.estimated_size != null) bits.push('规模=' + n.data.estimated_size);
    if (n.data && n.data.expected_city_count != null) bits.push('声明城市=' + n.data.expected_city_count);
    return `<span class="prop" title="${esc(miniGraphNodeTitle(n))}">${esc(kindLabel(n.kind))} · ${esc(trunc(n.name || n.id, 34))}${bits.length ? ' · ' + esc(bits.join(' · ')) : ''}</span>`;
  }).join('');
  const edgeChips = (spec.edges || []).map(e =>
    `<span class="prop" title="${esc(miniGraphEdgeTitle(e))}">${esc(REL_LABEL[e.relation] || e.relation)} → ${esc(trunc(e.target, 30))}${e.missing ? ' · 漏配' : (e.active === false ? ' · 已失效' : '')}</span>`).join('');
  const detail = nodeCount || edgeCount
    ? `<details style="margin-top:5px"><summary class="schema-sum">查看该步返回的顶点/边明细（${nodeCount} 顶点 / ${edgeCount} 边）</summary>
        ${nodeChips ? `<div class="sq-list">${nodeChips}</div>` : ''}
        ${edgeChips ? `<div class="sq-list">${edgeChips}</div>` : ''}
      </details>` : '';
  const title = spec.mode === 'graph' ? `第 ${spec.n} 步图谱查询结果` : `第 ${spec.n} 步数据来源`;
  const count = spec.mode === 'graph'
    ? `${nodeCount} 顶点 / ${edgeCount} 边${edgeCount ? ' · 虚线/红框=漏配' : ''}`
    : `汇总 ${nodeCount} 顶点 / ${edgeCount} 边（前序查询）`;
  return `<div class="sqh">${mode}<span>${title}</span>
      <span class="tag">${count}</span>
    </div>${graph}${detail}
    ${spec.source ? `<div class="sq-src"><b>结论来源</b>${esc(spec.source)}</div>` : ''}
    <div class="sq-note">${esc(spec.note)}</div>`;
}

function renderStepQueries(c, it) {
  const specs = caseStepFacts(c, it);
  document.querySelectorAll('[data-step-query]').forEach(el => {
    const spec = specs.find(x => x.n === Number(el.dataset.stepQuery));
    if (spec) el.innerHTML = stepQueryHtml(spec);
  });
}

/* 同一份输入：只看 rule_expression vs 本体增强。 */
function caseContrast(it) {
  const issues = it.issues || [], k = it.kpi || {}, rule = it.rule || {};
  const ruleOnly = issues.filter(x => x.source === 'rule_expression');
  const ontoOnly = issues.filter(x => !ruleOnly.includes(x));
  const cityIssue = issues.find(x => x.code === 'CITY_COVERAGE_MISMATCH');
  const missing = cityIssue ? (cityIssue.missing_cities || []) : [];
  const tags = rule.tag_semantics || [];
  const impact = state.caseImpact[it.crowd_id] || it.impact || null;
  const impactSummary = impact ? (impact.summary || impact) : null;
  const impactText = impactSummary
    ? `<b>${impactSummary.affected_total ?? '-'}</b> 个受影响资产 / <b>${impactSummary.edge_count ?? '-'}</b> 条边`
    : `<span data-case-impact="${esc(it.crowd_id)}">影响面加载中…</span>`;
  const ruleItems = ruleOnly.map(x =>
    `<li>${esc(ISSUE_LABEL[x.code] || x.code)}：${esc(x.message)}</li>`).join('');
  const ruleMiss = [
    tags.length ? `<li class="miss">不知道引用的 ${tags.length} 个标签真实表达式</li>` : '',
    cityIssue ? `<li class="miss">只知道城市数差 ${cityIssue.expected_count} vs ${cityIssue.actual_count}，不知道漏了哪 ${missing.length} 城</li>` : '',
    '<li class="miss">看不到下游影响面，也无法把修复安全落图</li>'
  ].filter(Boolean).join('');
  const ontoItems = issues.map(x =>
    `<li>${esc(ISSUE_LABEL[x.code] || x.code)}：${esc(x.message)}</li>`).join('');
  const ontoFacts = [
    tags.length ? `<li>标签事实：${esc(tags.map(t =>
      `${t.name}${t.vehicle_type ? ' · 车型 ' + t.vehicle_type : ''}${t.sticker_status ? ' · 车贴 ' + t.sticker_status : ''}`).join('、'))}</li>` : '',
    cityIssue ? `<li>城市事实：托管全集 ${cityIssue.expected_count} 城，规则 ${cityIssue.actual_count} 城，漏配 <b>${esc(missing.join('、') || '-')}</b></li>` : '',
    `<li>影响事实：${impactText}</li>`,
    `<li>资损事实：预计避免资损 <b>${money(k.avoided_loss)}</b></li>`,
    '<li>治理事实：propose_change → 人工确认 → 落图 → 审计</li>'
  ].filter(Boolean).join('');
  const conclusion = it.crowd_id === MAIN_CASE
    ? `规则文本只能发现 ${ruleOnly.length} 条；本体沿标签边补齐 ${tags.length} 个标签事实、从 ${cityIssue ? cityIssue.expected_count : '-'} 城托管全集锁定 ${missing.length} 个漏配城市，再算出下游影响面。这就是纯文本/裸大模型拿不到的增量。`
    : `单看“未贴 vs 已贴”确实只是口径冲突；本体还能证明引用标签“${tags[0] ? tags[0].name : '-'}”的真实表达式与业务意图相反，并把结论落到具体顶点/边和影响面上。`;
  return `
    <div class="llm-grid">
      <div class="llm-card bad">
        <div class="lt">只看规则文本 / 裸大模型</div>
        <div class="cmp-big">${ruleOnly.length} 条</div>
        <div class="cmp-sub">纯文本/规则对比能直接发现的冲突</div>
        <ul class="cmp-list">${ruleItems || '<li class="miss">没有可判定的字段冲突</li>'}${ruleMiss}</ul>
      </div>
      <div class="llm-card ok">
        <div class="lt">本体增强</div>
        <div class="cmp-big">${issues.length} 条</div>
        <div class="cmp-sub">规则 + 引用标签 + 托管城市全集 + 影响面</div>
        <ul class="cmp-list">${ontoItems}${ontoFacts}</ul>
      </div>
    </div>
    <div class="llm-note"><b>结论：</b>${esc(conclusion)} <span style="color:#94a3b8">本体额外发现 ${ontoOnly.length} 条。</span></div>`;
}

async function loadCaseImpact(crowdId) {
  if (!crowdId) return;
  if (state.caseImpact[crowdId]) { paintCaseImpact(crowdId); return; }
  try {
    const d = await api(`/assets/${encodeURIComponent(crowdId)}/impact?depth=3${atQuery()}`);
    state.caseImpact[crowdId] = d;
    if (state.selectedCrowd === crowdId) paintCaseImpact(crowdId);
  } catch (e) {
    document.querySelectorAll('[data-case-impact]').forEach(el => {
      if (el.dataset.caseImpact === crowdId) el.textContent = '影响面加载失败';
    });
  }
}

function paintCaseImpact(crowdId) {
  const d = state.caseImpact[crowdId];
  if (!d) return;
  const s = d.summary || {};
  document.querySelectorAll('[data-case-impact]').forEach(el => {
    if (el.dataset.caseImpact !== crowdId) return;
    el.innerHTML = `<b>${s.affected_total ?? '-'}</b> 个受影响资产 / <b>${s.edge_count ?? '-'}</b> 条边`;
  });
}

function correctionDetail(it) {
  const k = it.kpi || {}, intent = it.intent || {}, rule = it.rule || {};
  const intentChips = [
    intent.vehicle_type ? `<span class="chip">车型 <b>${esc(intent.vehicle_type)}</b></span>` : '',
    intent.sticker_status ? `<span class="chip">车贴 <b>${esc(intent.sticker_status)}</b></span>` : '',
    intent.expected_city_count ? `<span class="chip">声明城市 <b>${intent.expected_city_count}</b></span>` : '',
    ...(intent.concepts || []).map(c => `<span class="chip">概念 <b>${esc(c)}</b></span>`)
  ].filter(Boolean).join('');
  const issues = (it.issues || []).map(x => `
    <div class="issue ${esc(x.severity || 'MEDIUM')}">
      <div class="it">${riskBadge(x.severity || 'MEDIUM')}
        <b>${esc(ISSUE_LABEL[x.code] || x.code)}</b>
        <span class="mono">${esc(x.field || x.tag_id || '')}</span></div>
      <div>${esc(x.message)}</div>
      ${x.expected !== undefined || x.actual !== undefined
        ? `<div class="mono" style="margin-top:4px">期望 ${esc(x.expected ?? '-')} · 实际 ${esc(x.actual ?? '-')}</div>` : ''}
    </div>`).join('') || '<div class="empty">没有冲突项</div>';
  const suggestions = (it.suggestions || []).map((s, i) => `
    <div class="suggestion">
      <div class="st">${i + 1}. ${esc(s.label)}</div>
      <div style="color:#475569">${esc(s.reason || '')}</div>
      ${s.before ? `<div class="mono" style="margin-top:5px">修正前 <code>${esc(trunc(s.before, 150))}</code></div>` : ''}
      ${s.after ? `<div class="mono">修正后 <code>${esc(trunc(s.after, 150))}</code></div>` : ''}
      ${s.proposal_id
        ? `<div class="chips" style="margin-top:7px"><span class="chip">已生成提议 <b>${esc(s.proposal_id)}</b></span>
             <button class="btn-sm ok" data-gogate="1">去门禁审批 →</button></div>`
        : `<div style="margin-top:7px"><button class="btn-sm" data-propose="${i}" data-crowd="${esc(it.crowd_id)}">
             生成修复提议</button></div>`}
    </div>`).join('') || '<div class="empty">无需自动修复</div>';
  return `
    <div class="subhead" style="margin-top:0">诊断详情</div>
    <div class="card" style="margin-bottom:8px">
      <div class="ct">${esc(it.name || it.crowd_id)} ${riskBadge(it.risk_level)}</div>
      <div class="cm">${esc(it.crowd_id)} · Owner ${esc(it.owner || '-')} · ${esc(it.generated_at || '')}</div>
      <div class="chips">
        <span class="chip">结论 <b>${esc(it.verdict || '-')}</b></span>
        <span class="chip">预计规模 <b>${k.estimated_size ?? '-'}</b></span>
        <span class="chip">避免资损 <b>${money(k.avoided_loss)}</b></span>
        ${k.missing_city_count ? `<span class="chip">漏配城市 <b>${k.missing_city_count}</b></span>` : ''}
      </div>
      <div class="chips">${intentChips || '<span class="chip">未抽取到业务意图</span>'}</div>
      <div style="margin-top:8px">
        <button class="btn-sm" data-openasset="${esc(it.crowd_id)}">定位到资产</button>
        <button class="btn-sm" data-impact="${esc(it.crowd_id)}">查看影响面</button>
        <button class="btn-sm ok" data-forensic="${esc(it.crowd_id)}">查看图谱查询取证 →</button>
      </div>
    </div>
    <div class="subhead">诊断推理链 · 每一步查了什么、得出什么</div>
    ${correctionTrace(it)}
    <div class="subhead">本体到底多做了什么 · 同一份输入的两种看法</div>
    ${caseContrast(it)}
    <div class="subhead">图谱查询取证 · 这个诊断实际从 HugeGraph 查到的顶点与时态边</div>
    <div id="caseGraph" style="margin-bottom:4px">
      <div class="empty">加载该案例的图谱查询结果…</div>
    </div>
    <div class="subhead">圈选规则（${esc(rule.source || 'none')} · 覆盖 ${rule.city_count ?? 0} 城）</div>
    <div class="rulebox">${esc(rule.effective_expression || rule.expression || '未声明 rule_expression')}</div>
    <div class="subhead">冲突明细</div>${issues}
    <div class="subhead">修复建议 · 建议全部经写操作门禁确认</div>${suggestions}`;
}

function bindCorrectionActions() {
  const pane = $('#pane');
  pane.querySelectorAll('button[data-propose]').forEach(btn =>
    btn.addEventListener('click', () => proposeCorrection(btn.dataset.crowd, Number(btn.dataset.propose))));
  pane.querySelectorAll('button[data-gogate]').forEach(btn =>
    btn.addEventListener('click', () => {
      state.activeTab = 'gate';
      renderTabs();
      loadTab('gate');
    }));
  pane.querySelectorAll('button[data-openasset]').forEach(btn =>
    btn.addEventListener('click', () => selectAsset(btn.dataset.openasset)));
  pane.querySelectorAll('button[data-forensic]').forEach(btn =>
    btn.addEventListener('click', () => {
      if (state.selectedCrowd !== btn.dataset.forensic) state.caseContext = null;
      state.selectedCrowd = btn.dataset.forensic;
      state.activeTab = 'forensic';
      renderTabs();
      loadTab('forensic');
    }));
  pane.querySelectorAll('button[data-impact]').forEach(btn =>
    btn.addEventListener('click', async () => {
      state.activeTab = 'impact';
      await selectAsset(btn.dataset.impact);
    }));
  bindTraceSteps(pane);
}

async function proposeCorrection(crowdId, index) {
  const item = (state.corrections.items || []).find(i => i.crowd_id === crowdId);
  const sug = item && (item.suggestions || [])[index];
  if (!sug || !sug.propose_change) { toast('该建议不可直接提议', true); return; }
  try {
    const p = await api('/proposals', {method:'POST', body:JSON.stringify(sug.propose_change)});
    sug.proposal_id = p.id;
    renderCorrection();
    toast(`已生成修复提议 ${p.id}，等待人工确认`);
  } catch (e) {
    toast('生成提议失败：' + e.message, true);
  }
}

/* -------------------------------------------------------------- 校验 */
function renderValidation() {
  const d = state.validation, ok = !!d.ok;
  const checks = (d.checks || []).map(c =>
    `<div class="check ${c.ok ? 'ok' : 'bad'}"><span class="mark">${c.ok ? '✓' : '✗'}</span>${esc(c.name)}</div>`
  ).join('');
  const counts = Object.entries(d.counts || {}).map(([k, v]) =>
    `<span class="chip">${esc(REL_LABEL[k] || k)} <b>${v}</b></span>`).join('');
  const violations = [...(d.violations || []), ...(d.warnings || [])];
  const list = violations.length ? violations.map(v => `
    <li><span class="cid">${esc(v.code)}</span>
      <span>${esc(v.message)}${v.field ? ` <code>${esc(v.field)}</code>` : ''}</span></li>`).join('')
    : '<li><span class="cid">-</span><span>没有违规项</span></li>';
  $('#pane').innerHTML = `
    <div class="check ${ok ? 'ok' : 'bad'}" style="font-size:14px;font-weight:700;margin-bottom:12px">
      <span class="mark">${ok ? '✓' : '✗'}</span>${ok ? '语义校验通过' : '语义校验未通过'}
    </div>
    <div class="checks">${checks}</div>
    <div class="chips">${counts}</div>
    <div class="subhead">违规与告警</div>
    <ul class="clist">${list}</ul>`;
}

/* -------------------------------------------------------------- 证据链 */
function renderEvidence() {
  const d = state.evidence;
  const timeline = (d.timeline || []).map(t => `
    <li>
      <span class="time">${esc(t.at || '-')}</span>
      <span><span class="badge ${t.type === 'evidence' ? 'event' : 'version'}">${esc(t.type)}</span></span>
      <span><b>${esc(t.title || t.id)}</b><br><span class="mono">${esc(t.id)}</span>
        ${t.content || t.change_summary ? `<br><span style="color:#475569">${esc(t.content || t.change_summary)}</span>` : ''}
        ${t.operators && t.operators.length
          ? `<br><span style="color:#64748b">操作人：${t.operators.map(o => esc(o.name || o.id)).join(' / ')}</span>` : ''}
      </span>
    </li>`).join('') || '<li><span class="time">-</span><span></span><span>暂无证据或版本</span></li>';
  const ev = (d.evidence || []).map(e => {
    const p = e.vertex.properties || {};
    return `<div class="card">
      <div class="ct">${esc(p.name || e.vertex.id)}</div>
      <div class="cm">${esc(e.vertex.id)}</div>
      <div class="cm" style="margin-top:6px">${esc(p.content || '')}</div>
      <div class="chips">
        <span class="chip">来源 <b>${esc(p.source_system || '-')}</b></span>
        <span class="chip">类型 <b>${esc(p.evidence_type || '-')}</b></span>
        <span class="chip">置信度 <b>${esc(e.edge.confidence ?? p.confidence ?? '-')}</b></span>
        <span class="chip">观测 <b>${esc(p.observed_at || '-')}</b></span>
      </div>
    </div>`;
  }).join('');
  $('#pane').innerHTML = `
    <div class="chips" style="margin-top:0">
      ${atLabel()}
      <span class="chip">证据 <b>${d.evidence_count}</b></span>
      <span class="chip">版本 <b>${d.version_count}</b></span>
      <span class="chip">来源 <b>${esc((d.coverage.source_systems || []).join(' / ') || '-')}</b></span>
    </div>
    <div class="subhead">版本与证据时间线</div>
    <ul class="timeline">${timeline}</ul>
    <div class="subhead">证据卡片</div>
    <div class="evidence-grid">${ev || '<div class="empty">暂无证据</div>'}</div>`;
}

/* ---------------------------------------------------------------- 指标 */
function renderMetrics() {
  const d = state.metrics;
  const cards = (d.items || []).map(it => {
    const v = it.vertex || {};
    return `<div class="card">
      <div class="ct">${esc(v.display_name || v.name || v.id)}</div>
      <div class="cm">${esc(v.id)}</div>
      <div class="cv">${esc(v.value ?? '-')}
        <span style="font-size:12px;color:#64748b">${esc(v.unit || '')}</span></div>
      <div class="chips">
        <span class="chip">周期 <b>${esc(v.period || '-')}</b></span>
        <span class="chip">状态 <b>${esc(v.status || '-')}</b></span>
        <span class="chip">来源 <b>${esc(v.source_system || '-')}</b></span>
        ${it.edge && it.edge.weight !== undefined
          ? `<span class="chip">权重 <b>${esc(it.edge.weight)}</b></span>` : ''}
      </div>
      ${v.definition ? `<div class="cm" style="margin-top:7px">${esc(v.definition)}</div>` : ''}
    </div>`;
  }).join('');
  $('#pane').innerHTML = `
    <div class="chips" style="margin-top:0">
      <span class="chip">指标数 <b>${d.summary.count}</b></span>
      <span class="chip">有值 <b>${d.summary.valued_count}</b></span>
      <span class="chip">均值 <b>${d.summary.average ?? '-'}</b></span>
      <span class="chip">单位 <b>${esc((d.summary.units || []).join(' / ') || '-')}</b></span>
    </div>
    <div class="metric-grid" style="margin-top:12px">
      ${cards || '<div class="empty">该资产暂无关联指标</div>'}
    </div>`;
}

/* ------------------------------------------------------------ 写操作门禁 */
async function loadGate() {
  const payloads = {
    update_status: {status:'PAUSED', status_reason:'P0 纠错：暂停待人工复核'},
    attach_tag: {tag_id:'tag:crm:high_value', weight:0.55},
    attach_evidence: {confidence:0.9},
    publish_strategy: {},
    update_properties: {description:'语义层更新说明'}
  };
  $('#pane').innerHTML = `
    <div class="gate">
      <div class="form">
        <div class="subhead" style="margin:0">发起写操作提议</div>
        <label>动作</label>
        <select id="pAction">
          <option value="update_status">update_status · 状态迁移</option>
          <option value="attach_tag">attach_tag · 关联标签</option>
          <option value="attach_evidence">attach_evidence · 关联证据</option>
          <option value="publish_strategy">publish_strategy · 发布策略</option>
          <option value="update_properties">update_properties · 更新属性</option>
        </select>
        <label>目标资产 ID</label>
        <input id="pAsset" value="${esc(state.asset)}">
        <label>Payload（JSON）</label>
        <textarea id="pPayload">${esc(JSON.stringify(payloads.update_status, null, 2))}</textarea>
        <label>原因</label>
        <input id="pReason" value="P0 人群纠错演练">
        <label>提议人</label>
        <input id="pActor" value="agent_profile_ai">
        <button id="pSubmit">提交提议</button>
        <div id="pResult"></div>
      </div>
      <div>
        <div class="subhead" style="margin-top:0">提议与审批</div>
        <div id="proposalBox"><div class="empty">加载中…</div></div>
        <div class="subhead">审计日志</div>
        <div id="auditBox" style="max-height:300px;overflow:auto"></div>
      </div>
    </div>`;
  $('#pAction').addEventListener('change', e => {
    $('#pPayload').value = JSON.stringify(payloads[e.target.value] || {}, null, 2);
  });
  $('#pSubmit').addEventListener('click', submitProposal);
  await refreshGate();
}

async function refreshGate() {
  try {
    const [p, a] = await Promise.all([api('/proposals?limit=50'), api('/audit?limit=50')]);
    state.proposals = p.items || [];
    state.audit = a.items || [];
    renderProposals();
    renderAudit();
  } catch (e) {
    if ($('#proposalBox')) $('#proposalBox').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}

function renderProposals() {
  const box = $('#proposalBox');
  if (!box) return;
  if (!state.proposals.length) { box.innerHTML = '<div class="empty">暂无提议</div>'; return; }
  box.innerHTML = `<table class="table">
    <thead><tr><th>提议</th><th>动作</th><th>目标资产</th><th>状态</th><th>操作</th></tr></thead>
    <tbody>${state.proposals.map(p => `
      <tr>
        <td class="mono">${esc(p.id)}<br><span style="color:#94a3b8">${esc(p.actor)} · ${esc(p.created_at)}</span></td>
        <td>${esc(p.action)}</td>
        <td class="mono">${esc(p.asset_id)}</td>
        <td>${statusBadge(p.status)}${p.confirmed_by ? `<br><span style="color:#94a3b8">${esc(p.confirmed_by)}</span>` : ''}</td>
        <td>${p.status === 'PENDING'
          ? `<button class="btn-sm ok" data-act="confirm" data-id="${esc(p.id)}">确认</button>
             <button class="btn-sm bad" data-act="reject" data-id="${esc(p.id)}">驳回</button>`
          : '<span style="color:#94a3b8">-</span>'}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
  box.querySelectorAll('button[data-act]').forEach(b =>
    b.addEventListener('click', () => decideProposal(b.dataset.id, b.dataset.act === 'confirm')));
}

function renderAudit() {
  const box = $('#auditBox');
  if (!box) return;
  box.innerHTML = `<table class="table">
    <thead><tr><th>时间</th><th>动作</th><th>资产</th><th>操作人</th></tr></thead>
    <tbody>${state.audit.map(a => `
      <tr>
        <td class="mono">${esc(a.created_at)}</td>
        <td>${esc(a.action)}${a.proposal_id
          ? `<br><span class="mono" style="color:#94a3b8">${esc(a.proposal_id)}</span>` : ''}</td>
        <td class="mono">${esc(a.asset_id || '-')}</td>
        <td>${esc(a.actor)}</td>
      </tr>`).join('')}
    </tbody>
  </table>`;
}

async function submitProposal() {
  let payload;
  try { payload = JSON.parse($('#pPayload').value || '{}'); }
  catch (e) { toast('Payload 不是合法 JSON', true); return; }
  const body = {
    action: $('#pAction').value,
    asset_id: $('#pAsset').value.trim(),
    payload,
    reason: $('#pReason').value.trim(),
    actor: $('#pActor').value.trim()
  };
  $('#pResult').innerHTML = '';
  try {
    const p = await api('/proposals', {method:'POST', body:JSON.stringify(body)});
    $('#pResult').innerHTML = `<div class="check ok" style="margin-top:8px">
      <span class="mark">✓</span>提议已创建：<span class="mono">${esc(p.id)}</span>（${esc(p.status)}）</div>`;
    toast('提议已创建，等待人工确认');
    await refreshGate();
  } catch (e) {
    $('#pResult').innerHTML = `<div class="err" style="margin-top:8px">${esc(e.message)}</div>`;
    toast(e.message, true);
  }
}

async function decideProposal(id, approve) {
  const approver = prompt(approve ? '请输入确认人' : '请输入驳回人', 'alice');
  if (!approver) return;
  try {
    const r = await api(`/proposals/${encodeURIComponent(id)}/confirm`, {
      method:'POST', body:JSON.stringify({approver, approve})
    });
    toast(approve ? `已确认并执行：${id}` : `已驳回：${id}`);
    await refreshGate();
    if (state.asset) {
      state.context = await api(`/assets/${encodeURIComponent(state.asset)}/context?level=NETWORK`);
      renderHead();
      if (state.activeTab === 'gate') renderProposals();
    }
  } catch (e) {
    toast('操作失败：' + e.message, true);
  }
}

/* ---------------------------------------------------------------- 事件 */
let searchTimer = null;
$('#q').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(searchAssets, 260);
});
$('#kind').addEventListener('change', searchAssets);
$('#status').addEventListener('change', searchAssets);

function applyAsOf(value) {
  state.asOf = value ? new Date(value).toISOString() : '';
  state.caseImpact = {};
  state.caseContext = null;
  if (state.asset) selectAsset(state.asset);
}
$('#asOf').addEventListener('change', e => applyAsOf(e.target.value));
$('#asOfClear').addEventListener('click', () => {
  $('#asOf').value = '';
  applyAsOf('');
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (state.activeTab === 'graph' && $('#graph')) drawContextGraph();
    if (state.activeTab === 'impact' && $('#impactGraph')) renderImpact();
  }, 220);
});

window.addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  if (TABS.some(([k]) => k === h) && h !== state.activeTab) {
    state.activeTab = h;
    renderTabs();
    loadTab(h);
  }
});

(async function init() {
  await loadHealth();
  const h = location.hash.slice(1);
  if (TABS.some(([k]) => k === h)) state.activeTab = h;
  renderTabs();
  const preferred = MAIN_CASE;
  state.asset = preferred;
  await searchAssets();
  const target = state.assets.some(a => a.id === preferred)
    ? preferred : (state.assets[0] && state.assets[0].id);
  if (target) selectAsset(target);
})();
</script>
</body>
